<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Skybolt</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #120c24;
    overflow: hidden;
    touch-action: none;           /* no scroll/zoom gestures on mobile */
    -webkit-user-select: none;
    user-select: none;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    image-rendering: auto;
  }
</style>
</head>
<body>
<canvas id="game" aria-label="Skybolt game"></canvas>
<script>
'use strict';

/* =====================================================================
   CONFIG — tune the game from here.
   All sizes are in logical pixels on a fixed 480x720 playfield; the
   canvas is scaled to fit the screen, so these never change per device.
   ===================================================================== */
const CONFIG = {
  width: 480,
  height: 720,
  groundHeight: 96,

  // --- Player physics (px, px/s, px/s²) ---
  playerX: 130,           // Bolt's fixed horizontal position
  readyY: 300,            // where Bolt hovers on the start screen
  gravity: 1650,          // downward acceleration
  flapVelocity: -480,     // vertical speed set on each flap (negative = up)
  maxFallSpeed: 650,      // terminal falling speed
  maxTiltUp: -0.45,       // radians, nose-up tilt after a flap
  maxTiltDown: 1.3,       // radians, nose-down tilt when falling fast
  tiltResponse: 10,       // how quickly the tilt follows velocity
  hitboxForgiveness: 3,   // player hitbox is this many px smaller than the art

  // --- Speed & difficulty ---
  startSpeed: 150,        // world scroll speed at score 0 (px/s)
  maxSpeed: 220,          // speed never goes above this
  speedPerPoint: 2,       // extra speed for each point scored
  startGap: 195,          // vertical opening between crystals at score 0
  minGap: 145,            // the opening never gets smaller than this
  gapPerPoint: 1.5,       // opening shrinks by this much per point
  columnSpacing: 250,     // horizontal distance between column pairs
  gapEdgeMargin: 70,      // min distance from an opening to ceiling/ground
  maxGapShift: 230,       // max change in opening height between neighbours

  // --- Feel ---
  restartDelay: 0.6,      // seconds before the game-over screen accepts input
  volume: 0.6,            // master sound volume (0..1)

  // How fast each background layer moves relative to the ground (0..1).
  parallax: {
    stars: 0.02,
    clouds: 0.12,
    farRidge: 0.2,
    midRidge: 0.35,
    nearRidge: 0.55,
    ground: 1,
  },

  // Obstacle look
  columnWidth: 78,
  columnTipLength: 26,

  // Player look
  playerRadius: 18,
};

/* Colour palette: dusk sky, teal crystals, coral robot. */
const PALETTE = {
  skyTop: '#1d1540',
  skyMid: '#5b2a6e',
  skyLow: '#c8577a',
  skyHorizon: '#f6a97a',
  star: '#fff4e0',
  sun: '#ffd39b',
  sunGlow: 'rgba(255, 200, 140, 0.35)',

  cloud: '#ffc9c0',
  cloudShade: '#e3929f',

  farRidge: '#b56b8b',
  midRidge: '#7a3f78',
  nearRidge: '#4a2a5e',

  crystalLight: '#b8fff2',
  crystalMid: '#46e0c8',
  crystalDark: '#1b9e9e',
  crystalCollar: '#14707a',
  crystalOutline: '#0e3f4f',

  groundDark: '#2e1a3a',
  groundStripe: '#3a2148',
  mossLight: '#9ff5e1',
  moss: '#3fcfb2',
  mossShade: '#23947f',
  pebble: '#46e0c8',

  robotBody: '#ff8a5b',
  robotLight: '#ffc29a',
  robotShade: '#d9533f',
  robotOutline: '#3b1730',
  robotCream: '#fff1dc',
  robotMetal: '#6b5a7d',
  visor: '#2a2045',
  eye: '#5ff6ff',
  propLight: '#ffe08a',
  propDark: '#d9a043',
  blush: '#ff6f8e',

  text: '#fff1dc',
  textOutline: '#2a1640',
  panel: 'rgba(24, 14, 44, 0.72)',
  panelSolid: 'rgba(24, 14, 44, 0.9)',
  dim: 'rgba(18, 10, 36, 0.35)',
};

const W = CONFIG.width;
const H = CONFIG.height;
const GROUND_Y = H - CONFIG.groundHeight;
const FONT = "'Trebuchet MS', 'Segoe UI', system-ui, sans-serif";

/* =====================================================================
   Canvas setup and responsive scaling
   ===================================================================== */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// Fit the canvas inside the window while keeping the 2:3 aspect ratio,
// and render at device-pixel resolution so it stays crisp on phones.
function resize() {
  const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
  const cssW = Math.floor(W * scale);
  const cssH = Math.floor(H * scale);
  canvas.style.width = cssW + 'px';
  canvas.style.height = cssH + 'px';
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);
  // After this, all drawing uses logical 480x720 coordinates.
  ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
}
window.addEventListener('resize', resize);
resize();

/* =====================================================================
   Small helpers
   ===================================================================== */

// Deterministic PRNG so the scenery looks the same on every load.
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function roundRectPath(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

// Positive modulo, for wrapping scroll offsets.
function wrap(v, m) {
  return ((v % m) + m) % m;
}

/* =====================================================================
   Pre-generated scenery
   ===================================================================== */
const SCENERY_TILE = 960; // every background layer repeats every 960px
const rand = mulberry32(1337);

const STARS = Array.from({ length: 70 }, () => ({
  x: rand() * SCENERY_TILE,
  y: rand() * 300,
  r: 0.6 + rand() * 1.3,
  phase: rand() * Math.PI * 2,
  speed: 1 + rand() * 2.5,
}));

const CLOUDS = Array.from({ length: 7 }, (_, i) => ({
  x: (i / 7) * SCENERY_TILE + rand() * 80,
  y: 90 + rand() * 230,
  s: 0.6 + rand() * 0.7,
}));

// A ridge is a list of heights sampled every RIDGE_STEP px across one tile.
// Integer frequencies make each layer tile seamlessly.
const RIDGE_STEP = 8;
function makeRidge(baseY, waves, peaky) {
  const pts = [];
  for (let x = 0; x <= SCENERY_TILE; x += RIDGE_STEP) {
    let h = 0;
    for (const [freq, amp, phase] of waves) {
      const a = (Math.PI * freq * x) / SCENERY_TILE + phase;
      // "peaky" gives sharp mountain tops, otherwise rolling hills.
      h += peaky ? amp * (1 - Math.abs(Math.sin(a))) : amp * Math.sin(a * 2);
    }
    pts.push(baseY - h);
  }
  return pts;
}
const FAR_RIDGE = makeRidge(520, [[3, 70, 0.4], [7, 30, 1.1], [17, 10, 0.2]], true);
const MID_RIDGE = makeRidge(575, [[2, 26, 0.9], [5, 14, 2.0], [11, 5, 0.5]], false);
const NEAR_RIDGE = makeRidge(612, [[3, 18, 2.4], [7, 8, 0.3]], false);

// Crystal pebbles embedded in the ground strip (repeat every 240px).
const PEBBLE_TILE = 240;
const PEBBLES = Array.from({ length: 6 }, () => ({
  x: rand() * PEBBLE_TILE,
  y: GROUND_Y + 30 + rand() * (CONFIG.groundHeight - 44),
  s: 2 + rand() * 3,
}));

/* =====================================================================
   Draw functions — background layers
   ===================================================================== */

function drawSky(c, time, scroll) {
  const g = c.createLinearGradient(0, 0, 0, GROUND_Y);
  g.addColorStop(0, PALETTE.skyTop);
  g.addColorStop(0.45, PALETTE.skyMid);
  g.addColorStop(0.78, PALETTE.skyLow);
  g.addColorStop(1, PALETTE.skyHorizon);
  c.fillStyle = g;
  c.fillRect(0, 0, W, GROUND_Y);

  // Twinkling stars, fading out toward the horizon.
  const off = wrap(scroll * CONFIG.parallax.stars, SCENERY_TILE);
  c.fillStyle = PALETTE.star;
  for (const s of STARS) {
    const x = wrap(s.x - off, SCENERY_TILE);
    if (x > W) continue;
    const twinkle = 0.55 + 0.45 * Math.sin(time * s.speed + s.phase);
    c.globalAlpha = twinkle * (1 - s.y / 330);
    c.beginPath();
    c.arc(x, s.y, s.r, 0, Math.PI * 2);
    c.fill();
  }
  c.globalAlpha = 1;
}

function drawSun(c) {
  const x = 330, y = 470, r = 62;
  const glow = c.createRadialGradient(x, y, r * 0.8, x, y, r * 2.6);
  glow.addColorStop(0, PALETTE.sunGlow);
  glow.addColorStop(1, 'rgba(255, 200, 140, 0)');
  c.fillStyle = glow;
  c.fillRect(x - r * 3, y - r * 3, r * 6, r * 6);
  c.fillStyle = PALETTE.sun;
  c.beginPath();
  c.arc(x, y, r, 0, Math.PI * 2);
  c.fill();
  // Horizontal bands cut into the sun for a retro dusk look.
  c.fillStyle = PALETTE.skyLow;
  for (let i = 0; i < 4; i++) {
    c.fillRect(x - r, y + 12 + i * 13, r * 2, 2 + i * 1.5);
  }
}

function drawCloud(c, x, y, s) {
  const puffs = [[0, 0, 22], [24, -10, 26], [52, -2, 20], [72, 6, 14], [-20, 8, 14]];
  c.fillStyle = PALETTE.cloudShade;
  for (const [px, py, r] of puffs) {
    c.beginPath();
    c.arc(x + px * s, y + py * s + 5 * s, r * s, 0, Math.PI * 2);
    c.fill();
  }
  c.fillStyle = PALETTE.cloud;
  for (const [px, py, r] of puffs) {
    c.beginPath();
    c.arc(x + px * s, y + py * s, r * s, 0, Math.PI * 2);
    c.fill();
  }
}

function drawClouds(c, scroll) {
  const off = wrap(scroll * CONFIG.parallax.clouds, SCENERY_TILE);
  c.globalAlpha = 0.8;
  for (const cl of CLOUDS) {
    // Draw twice so clouds wrap smoothly across the tile seam.
    let x = wrap(cl.x - off, SCENERY_TILE) - 100;
    drawCloud(c, x, cl.y, cl.s);
    if (x + 200 > SCENERY_TILE - W) drawCloud(c, x - SCENERY_TILE, cl.y, cl.s);
  }
  c.globalAlpha = 1;
}

function drawRidge(c, pts, scroll, factor, color) {
  const off = wrap(scroll * factor, SCENERY_TILE);
  c.fillStyle = color;
  c.beginPath();
  c.moveTo(0, GROUND_Y);
  for (let x = 0; x <= W + RIDGE_STEP; x += RIDGE_STEP) {
    const tx = wrap(x + off, SCENERY_TILE);
    const i = Math.floor(tx / RIDGE_STEP);
    const t = (tx - i * RIDGE_STEP) / RIDGE_STEP;
    const y = pts[i] + (pts[i + 1] - pts[i]) * t; // linear interpolation
    c.lineTo(x, y);
  }
  c.lineTo(W + RIDGE_STEP, GROUND_Y);
  c.closePath();
  c.fill();
}

function drawBackground(c, time, scroll) {
  drawSky(c, time, scroll);
  drawSun(c);
  drawClouds(c, scroll);
  drawRidge(c, FAR_RIDGE, scroll, CONFIG.parallax.farRidge, PALETTE.farRidge);
  drawRidge(c, MID_RIDGE, scroll, CONFIG.parallax.midRidge, PALETTE.midRidge);
  drawRidge(c, NEAR_RIDGE, scroll, CONFIG.parallax.nearRidge, PALETTE.nearRidge);
}

/* =====================================================================
   Draw functions — ground strip
   ===================================================================== */
function drawGround(c, scroll) {
  const off = wrap(scroll * CONFIG.parallax.ground, 40);
  const gh = CONFIG.groundHeight;

  c.fillStyle = PALETTE.groundDark;
  c.fillRect(0, GROUND_Y, W, gh);

  // Diagonal rock stripes that scroll with the world.
  c.save();
  c.beginPath();
  c.rect(0, GROUND_Y + 12, W, gh);
  c.clip();
  c.fillStyle = PALETTE.groundStripe;
  for (let x = -off - 40; x < W + 60; x += 40) {
    c.beginPath();
    c.moveTo(x, H);
    c.lineTo(x + 18, H);
    c.lineTo(x + 18 + gh, GROUND_Y);
    c.lineTo(x + gh, GROUND_Y);
    c.closePath();
    c.fill();
  }
  c.restore();

  // Tiny crystal pebbles.
  const pOff = wrap(scroll, PEBBLE_TILE);
  c.fillStyle = PALETTE.pebble;
  for (let k = 0; k < 3; k++) {
    for (const p of PEBBLES) {
      const x = p.x - pOff + k * PEBBLE_TILE;
      if (x < -10 || x > W + 10) continue;
      c.beginPath();
      c.moveTo(x, p.y - p.s * 1.6);
      c.lineTo(x + p.s, p.y);
      c.lineTo(x, p.y + p.s * 0.8);
      c.lineTo(x - p.s, p.y);
      c.closePath();
      c.fill();
    }
  }

  // Mossy top edge with scalloped underside.
  const sOff = wrap(scroll, 20);
  c.fillStyle = PALETTE.mossShade;
  for (let x = -sOff - 20; x < W + 20; x += 20) {
    c.beginPath();
    c.arc(x + 10, GROUND_Y + 14, 7, 0, Math.PI);
    c.fill();
  }
  c.fillStyle = PALETTE.moss;
  c.fillRect(0, GROUND_Y, W, 13);
  for (let x = -sOff - 20; x < W + 20; x += 20) {
    c.beginPath();
    c.arc(x + 10, GROUND_Y + 11, 7, 0, Math.PI);
    c.fill();
  }
  c.fillStyle = PALETTE.mossLight;
  c.fillRect(0, GROUND_Y, W, 3);
}

/* =====================================================================
   Draw functions — crystal column obstacles
   ===================================================================== */

// Draws one crystal column in local space: root at y=0, tip pointing
// toward +y, ending at y=length. Callers flip it for the bottom piece.
function drawCrystal(c, x, length, time) {
  const w = CONFIG.columnWidth;
  const T = CONFIG.columnTipLength;
  const shaftEnd = length - T;
  const a = w * 0.28, b = w * 0.7;          // facet split lines
  const ax = w * 0.42, bx = w * 0.58;       // blunt tip edges

  c.save();
  c.translate(x, 0);

  // Shaft facets: light / mid / dark bands.
  c.fillStyle = PALETTE.crystalLight;
  c.fillRect(0, -2, a, shaftEnd + 2);
  c.fillStyle = PALETTE.crystalMid;
  c.fillRect(a, -2, b - a, shaftEnd + 2);
  c.fillStyle = PALETTE.crystalDark;
  c.fillRect(b, -2, w - b, shaftEnd + 2);

  // Faint diagonal streaks on the middle facet.
  c.save();
  c.beginPath();
  c.rect(a, 0, b - a, shaftEnd);
  c.clip();
  c.strokeStyle = 'rgba(255, 255, 255, 0.35)';
  c.lineWidth = 3;
  for (let y = shaftEnd - 30; y > -60; y -= 90) {
    c.beginPath();
    c.moveTo(a, y + 30);
    c.lineTo(b, y);
    c.stroke();
  }
  c.restore();

  // Tip facets.
  c.fillStyle = PALETTE.crystalLight;
  c.beginPath();
  c.moveTo(0, shaftEnd); c.lineTo(a, shaftEnd); c.lineTo(ax, length);
  c.closePath(); c.fill();
  c.fillStyle = PALETTE.crystalMid;
  c.beginPath();
  c.moveTo(a, shaftEnd); c.lineTo(b, shaftEnd); c.lineTo(bx, length); c.lineTo(ax, length);
  c.closePath(); c.fill();
  c.fillStyle = PALETTE.crystalDark;
  c.beginPath();
  c.moveTo(b, shaftEnd); c.lineTo(w, shaftEnd); c.lineTo(bx, length);
  c.closePath(); c.fill();

  // Collar band where the shaft meets the tip.
  c.fillStyle = PALETTE.crystalCollar;
  roundRectPath(c, -4, shaftEnd - 12, w + 8, 12, 3);
  c.fill();
  c.fillStyle = 'rgba(255, 255, 255, 0.3)';
  c.fillRect(-2, shaftEnd - 10, w + 4, 2);

  // Outline around the whole silhouette.
  c.strokeStyle = PALETTE.crystalOutline;
  c.lineWidth = 2;
  c.beginPath();
  c.moveTo(0, -2);
  c.lineTo(0, shaftEnd);
  c.lineTo(ax, length);
  c.lineTo(bx, length);
  c.lineTo(w, shaftEnd);
  c.lineTo(w, -2);
  c.stroke();
  roundRectPath(c, -4, shaftEnd - 12, w + 8, 12, 3);
  c.stroke();

  // Twinkling sparkle near the tip.
  const tw = 0.5 + 0.5 * Math.sin(time * 4 + x * 0.05);
  drawSparkle(c, a * 0.6, shaftEnd - 26, 3 + tw * 4, tw);

  c.restore();
}

function drawSparkle(c, x, y, size, alpha) {
  c.save();
  c.globalAlpha = alpha;
  c.fillStyle = '#ffffff';
  c.beginPath();
  c.moveTo(x, y - size);
  c.quadraticCurveTo(x, y, x + size, y);
  c.quadraticCurveTo(x, y, x, y + size);
  c.quadraticCurveTo(x, y, x - size, y);
  c.quadraticCurveTo(x, y, x, y - size);
  c.fill();
  c.restore();
}

// A full obstacle: top crystal hanging from the ceiling, bottom crystal
// growing from the ground. gapTop/gapBottom are the tip positions.
function drawColumnPair(c, x, gapTop, gapBottom, time) {
  // Top piece (root at y=0, tip pointing down).
  drawCrystal(c, x, gapTop, time);
  // Bottom piece: flip vertically around the ground line.
  c.save();
  c.translate(0, GROUND_Y);
  c.scale(1, -1);
  drawCrystal(c, x, GROUND_Y - gapBottom, time + 1.7);
  c.restore();
}

/* =====================================================================
   Draw functions — the player: "Bolt", a round propeller robot
   ===================================================================== */

// Two-bladed propeller seen from the side. Each blade's visible length
// follows cos(angle), which reads as spinning.
function drawPropeller(c, hx, hy, angle) {
  // Faint motion-blur disc.
  c.fillStyle = 'rgba(255, 240, 200, 0.18)';
  c.beginPath();
  c.ellipse(hx, hy, 17, 3.2, 0, 0, Math.PI * 2);
  c.fill();

  const blades = [0, Math.PI].map((o) => ({
    cos: Math.cos(angle + o),
    front: Math.sin(angle + o) > 0,
  }));
  blades.sort((p, q) => p.front - q.front); // back blade first
  for (const bl of blades) {
    c.fillStyle = bl.front ? PALETTE.propLight : PALETTE.propDark;
    c.beginPath();
    c.ellipse(hx + bl.cos * 8, hy, Math.abs(bl.cos) * 8 + 1.5, 2.6, 0, 0, Math.PI * 2);
    c.fill();
  }
  c.fillStyle = PALETTE.robotMetal;
  c.beginPath();
  c.arc(hx, hy, 3.4, 0, Math.PI * 2);
  c.fill();
}

/**
 * @param x,y      centre of the robot
 * @param angle    body tilt in radians (+ = nose down)
 * @param prop     propeller angle in radians
 * @param flap     0..1 squash amount right after a flap
 * @param eye      'open' | 'blink' | 'ko' (knocked out after a crash)
 */
function drawPlayer(c, x, y, angle, prop, flap, eye) {
  const R = CONFIG.playerRadius;
  c.save();
  c.translate(x, y);
  c.rotate(angle);
  c.scale(1 + flap * 0.08, 1 - flap * 0.08);

  // Antenna mast + propeller.
  c.fillStyle = PALETTE.robotMetal;
  c.fillRect(-2, -R - 9, 4, 11);
  drawPropeller(c, 0, -R - 10, prop);

  // Little back fin that kicks up when flapping.
  c.save();
  c.translate(-R + 4, 3);
  c.rotate(0.5 + flap * 0.7);
  c.fillStyle = PALETTE.robotShade;
  roundRectPath(c, -13, -4, 14, 8, 4);
  c.fill();
  c.strokeStyle = PALETTE.robotOutline;
  c.lineWidth = 2;
  c.stroke();
  c.restore();

  // Body sphere.
  const g = c.createRadialGradient(-6, -8, 2, 0, 0, R);
  g.addColorStop(0, PALETTE.robotLight);
  g.addColorStop(0.55, PALETTE.robotBody);
  g.addColorStop(1, PALETTE.robotShade);
  c.fillStyle = g;
  c.beginPath();
  c.arc(0, 0, R, 0, Math.PI * 2);
  c.fill();

  // Cream belly plate (clipped to the body).
  c.save();
  c.beginPath();
  c.arc(0, 0, R, 0, Math.PI * 2);
  c.clip();
  c.fillStyle = PALETTE.robotCream;
  c.beginPath();
  c.ellipse(-2, R * 0.95, R * 0.95, R * 0.55, 0, 0, Math.PI * 2);
  c.fill();
  c.restore();

  c.strokeStyle = PALETTE.robotOutline;
  c.lineWidth = 2;
  c.beginPath();
  c.arc(0, 0, R, 0, Math.PI * 2);
  c.stroke();

  // Visor with a single glowing eye.
  c.fillStyle = PALETTE.visor;
  roundRectPath(c, 1, -10, 16, 14, 6);
  c.fill();
  if (eye === 'blink') {
    c.strokeStyle = PALETTE.eye;
    c.lineWidth = 2;
    c.beginPath();
    c.moveTo(7, -3);
    c.lineTo(14, -3);
    c.stroke();
  } else if (eye === 'ko') {
    c.strokeStyle = PALETTE.eye;
    c.lineWidth = 2;
    c.lineCap = 'round';
    c.beginPath();
    c.moveTo(7.5, -6); c.lineTo(13.5, 0);
    c.moveTo(13.5, -6); c.lineTo(7.5, 0);
    c.stroke();
    c.lineCap = 'butt';
  } else {
    c.fillStyle = 'rgba(95, 246, 255, 0.3)';
    c.beginPath();
    c.arc(10.5, -3, 6, 0, Math.PI * 2);
    c.fill();
    c.fillStyle = PALETTE.eye;
    c.beginPath();
    c.arc(10.5, -3, 3.8, 0, Math.PI * 2);
    c.fill();
    c.fillStyle = '#ffffff';
    c.beginPath();
    c.arc(12, -4.5, 1.3, 0, Math.PI * 2);
    c.fill();
  }

  // Cheek light, rivets and a glossy highlight.
  c.fillStyle = PALETTE.blush;
  c.globalAlpha = 0.7;
  c.beginPath();
  c.arc(7, 8, 2.6, 0, Math.PI * 2);
  c.fill();
  c.globalAlpha = 1;
  c.fillStyle = PALETTE.robotOutline;
  for (const rx of [-8, -2]) {
    c.beginPath();
    c.arc(rx, 11, 1.2, 0, Math.PI * 2);
    c.fill();
  }
  c.fillStyle = 'rgba(255, 255, 255, 0.55)';
  c.beginPath();
  c.ellipse(-8, -10, 4.5, 2.6, -0.6, 0, Math.PI * 2);
  c.fill();

  c.restore();
}

/* =====================================================================
   Draw functions — HUD
   ===================================================================== */
// Outlined, centred text used for the score and panel headings.
function drawText(c, text, x, y, size, color = PALETTE.text) {
  c.font = `bold ${size}px ${FONT}`;
  c.textAlign = 'center';
  c.textBaseline = 'middle';
  c.lineJoin = 'round';
  c.lineWidth = Math.max(3, size * 0.16);
  c.strokeStyle = PALETTE.textOutline;
  c.strokeText(String(text), x, y);
  c.fillStyle = color;
  c.fillText(String(text), x, y);
}

function drawScore(c, value, x, y, size) {
  drawText(c, value, x, y, size);
}

// Plain (un-outlined) small text for use inside panels.
function drawSmallText(c, text, x, y, size, color = PALETTE.text) {
  c.font = `bold ${size}px ${FONT}`;
  c.textAlign = 'center';
  c.textBaseline = 'middle';
  c.fillStyle = color;
  c.fillText(text, x, y);
}

function drawPanel(c, x, y, w, h) {
  c.fillStyle = PALETTE.panelSolid;
  roundRectPath(c, x, y, w, h, 18);
  c.fill();
  c.strokeStyle = PALETTE.crystalMid;
  c.lineWidth = 2;
  c.stroke();
}

function drawSoundIcon(c, x, y, muted) {
  c.fillStyle = PALETTE.panel;
  c.beginPath();
  c.arc(x, y, 20, 0, Math.PI * 2);
  c.fill();
  c.fillStyle = PALETTE.text;
  c.beginPath();
  c.moveTo(x - 10, y - 4);
  c.lineTo(x - 5, y - 4);
  c.lineTo(x + 1, y - 10);
  c.lineTo(x + 1, y + 10);
  c.lineTo(x - 5, y + 4);
  c.lineTo(x - 10, y + 4);
  c.closePath();
  c.fill();
  c.strokeStyle = PALETTE.text;
  c.lineWidth = 2;
  c.lineCap = 'round';
  c.beginPath();
  if (muted) {
    c.moveTo(x + 5, y - 5); c.lineTo(x + 12, y + 5);
    c.moveTo(x + 12, y - 5); c.lineTo(x + 5, y + 5);
  } else {
    c.arc(x + 2, y, 6, -0.9, 0.9);
    c.moveTo(x + 2 + 11 * Math.cos(-0.9), y + 11 * Math.sin(-0.9));
    c.arc(x + 2, y, 11, -0.9, 0.9);
  }
  c.stroke();
  c.lineCap = 'butt';
}

function drawLabel(c, text, x, y) {
  c.font = `bold 13px ${FONT}`;
  c.textAlign = 'center';
  c.textBaseline = 'middle';
  const w = c.measureText(text).width + 16;
  c.fillStyle = PALETTE.panel;
  roundRectPath(c, x - w / 2, y - 11, w, 22, 11);
  c.fill();
  c.fillStyle = PALETTE.text;
  c.fillText(text, x, y + 1);
}


/* =====================================================================
   Persistence (high score + mute) — localStorage can throw in private
   mode, so every access is guarded.
   ===================================================================== */
const STORAGE = { best: 'skybolt.best', muted: 'skybolt.muted' };

function loadNumber(key) {
  try { return Number(localStorage.getItem(key)) || 0; } catch (e) { return 0; }
}
function saveValue(key, value) {
  try { localStorage.setItem(key, String(value)); } catch (e) { /* ignore */ }
}

/* =====================================================================
   Sound — tiny synthesized effects with the Web Audio API.
   The AudioContext is created on the first input (browser autoplay rules).
   ===================================================================== */
const sound = {
  ctx: null,
  master: null,
  muted: loadNumber(STORAGE.muted) === 1,

  init() {
    if (this.ctx) {
      if (this.ctx.state === 'suspended') this.ctx.resume();
      return;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = this.muted ? 0 : CONFIG.volume;
    this.master.connect(this.ctx.destination);
  },

  toggleMute() {
    this.muted = !this.muted;
    saveValue(STORAGE.muted, this.muted ? 1 : 0);
    if (this.master) {
      this.master.gain.setValueAtTime(this.muted ? 0 : CONFIG.volume, this.ctx.currentTime);
    }
  },

  ready() {
    return this.ctx && !this.muted;
  },

  // One oscillator note with a pitch sweep and a quick fade-out.
  tone(type, f0, f1, dur, vol, delay = 0) {
    const t = this.ctx.currentTime + delay;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(f0, t);
    osc.frequency.exponentialRampToValueAtTime(f1, t + dur);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(this.master);
    osc.start(t);
    osc.stop(t + dur + 0.02);
  },

  // Low-passed white-noise burst (used for the crash).
  noise(dur, vol) {
    const t = this.ctx.currentTime;
    const len = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    const filter = this.ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 1100;
    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(filter).connect(gain).connect(this.master);
    src.start(t);
  },

  flap() {
    if (!this.ready()) return;
    this.tone('triangle', 420, 780, 0.09, 0.25);
  },
  score() {
    if (!this.ready()) return;
    this.tone('sine', 880, 880, 0.09, 0.18);
    this.tone('sine', 1320, 1320, 0.16, 0.18, 0.08);
  },
  hit() {
    if (!this.ready()) return;
    this.noise(0.28, 0.5);
    this.tone('square', 220, 50, 0.32, 0.15);
  },
};

/* =====================================================================
   Game state
   ===================================================================== */
// States: 'ready' (start screen) → 'playing' → 'dying' (falling after a
// crash) → 'over' (game-over screen) → back to 'ready'.
const game = {
  state: 'ready',
  time: 0,
  scroll: 0,          // total distance scrolled, drives every layer
  speed: CONFIG.startSpeed,
  score: 0,
  best: loadNumber(STORAGE.best),
  newBest: false,
  columns: [],
  lastGapCenter: GROUND_Y / 2,
  overTimer: 0,       // time spent on the game-over screen
  shake: 0,           // screen-shake timer after a crash
  flash: 0,           // white flash after a crash
  player: null,
};

function resetGame() {
  game.state = 'ready';
  game.speed = CONFIG.startSpeed;
  game.score = 0;
  game.newBest = false;
  game.columns = [];
  game.lastGapCenter = GROUND_Y / 2;
  game.overTimer = 0;
  game.player = {
    y: CONFIG.readyY,
    vy: 0,
    angle: 0,
    prop: 0,          // propeller angle
    propSpeed: 16,    // propeller spin speed (rad/s)
    flap: 0,          // 0..1 squash after a flap
  };
}

function startGame() {
  game.state = 'playing';
  spawnColumn(W + 120);
  flap();
}

function flap() {
  const p = game.player;
  p.vy = CONFIG.flapVelocity;
  p.flap = 1;
  p.propSpeed = 42;
  sound.flap();
}

/* =====================================================================
   Obstacles
   ===================================================================== */
function currentGap() {
  return Math.max(CONFIG.minGap, CONFIG.startGap - game.score * CONFIG.gapPerPoint);
}

function spawnColumn(x) {
  const gap = currentGap();
  // Keep the opening away from the ceiling/ground and not too far from
  // the previous one, so every layout is reachable.
  const minC = CONFIG.gapEdgeMargin + gap / 2;
  const maxC = GROUND_Y - CONFIG.gapEdgeMargin - gap / 2;
  const lo = Math.max(minC, game.lastGapCenter - CONFIG.maxGapShift);
  const hi = Math.min(maxC, game.lastGapCenter + CONFIG.maxGapShift);
  const center = lo + Math.random() * (hi - lo);
  game.lastGapCenter = center;
  game.columns.push({
    x,
    gapTop: center - gap / 2,
    gapBottom: center + gap / 2,
    passed: false,
    sparkle: Math.random() * 10, // desyncs the sparkle animation
  });
}

// Outline of one crystal as a polygon, matching drawCrystal(). For the
// bottom crystal the shape is mirrored around the ground line.
function crystalPolygon(x, length, bottom) {
  const w = CONFIG.columnWidth;
  const se = length - CONFIG.columnTipLength; // shaft end
  const pts = [
    [x, -50], [x + w, -50],
    [x + w, se - 12], [x + w + 4, se - 12], [x + w + 4, se], [x + w, se],
    [x + w * 0.58, length], [x + w * 0.42, length],
    [x, se], [x - 4, se], [x - 4, se - 12], [x, se - 12],
  ];
  if (bottom) for (const p of pts) p[1] = GROUND_Y - p[1];
  return pts;
}

/* =====================================================================
   Collision helpers
   ===================================================================== */
function distSqToSegment(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  const len = dx * dx + dy * dy;
  let t = len ? ((px - ax) * dx + (py - ay) * dy) / len : 0;
  t = Math.max(0, Math.min(1, t));
  const cx = ax + t * dx - px, cy = ay + t * dy - py;
  return cx * cx + cy * cy;
}

// True if a circle overlaps a (possibly concave) polygon.
function circleHitsPolygon(cx, cy, r, pts) {
  let inside = false;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const [xi, yi] = pts[i], [xj, yj] = pts[j];
    if ((yi > cy) !== (yj > cy) && cx < ((xj - xi) * (cy - yi)) / (yj - yi) + xi) inside = !inside;
    if (distSqToSegment(cx, cy, xi, yi, xj, yj) <= r * r) return true;
  }
  return inside;
}

function hitsColumn(col, cx, cy, r) {
  const w = CONFIG.columnWidth;
  if (cx + r < col.x - 4 || cx - r > col.x + w + 4) return false; // quick reject
  return (
    circleHitsPolygon(cx, cy, r, crystalPolygon(col.x, col.gapTop, false)) ||
    circleHitsPolygon(cx, cy, r, crystalPolygon(col.x, GROUND_Y - col.gapBottom, true))
  );
}

/* =====================================================================
   Update (runs at a fixed 120 steps per second)
   ===================================================================== */
function crash() {
  game.state = 'dying';
  game.shake = 0.35;
  game.flash = 1;
  game.player.vy = Math.max(game.player.vy, 60);
  sound.hit();
}

function endRun() {
  game.state = 'over';
  game.overTimer = 0;
  if (game.score > game.best) {
    game.best = game.score;
    game.newBest = true;
    saveValue(STORAGE.best, game.best);
  }
}

// Gravity, capped fall speed, and tilt that follows vertical velocity.
function applyPhysics(dt, tiltDownBias) {
  const p = game.player;
  p.vy = Math.min(p.vy + CONFIG.gravity * dt, CONFIG.maxFallSpeed);
  p.y += p.vy * dt;
  const target = Math.min(
    CONFIG.maxTiltDown,
    Math.max(CONFIG.maxTiltUp, (p.vy / CONFIG.maxFallSpeed) * CONFIG.maxTiltDown + tiltDownBias)
  );
  p.angle += (target - p.angle) * Math.min(1, dt * CONFIG.tiltResponse);
}

function update(dt) {
  const p = game.player;
  const R = CONFIG.playerRadius;
  game.time += dt;
  game.shake = Math.max(0, game.shake - dt);
  game.flash = Math.max(0, game.flash - dt * 3);
  p.flap = Math.max(0, p.flap - dt * 5);
  p.prop += p.propSpeed * dt;

  switch (game.state) {
    case 'ready': {
      // Hover in place while the world drifts by.
      game.scroll += CONFIG.startSpeed * dt;
      p.y = CONFIG.readyY + Math.sin(game.time * 3) * 6;
      p.angle = 0;
      p.propSpeed += (16 - p.propSpeed) * Math.min(1, dt * 3);
      break;
    }

    case 'playing': {
      // Difficulty ramps gently with score, up to the configured limits.
      game.speed = Math.min(CONFIG.maxSpeed, CONFIG.startSpeed + game.score * CONFIG.speedPerPoint);
      const dx = game.speed * dt;
      game.scroll += dx;

      for (const col of game.columns) col.x -= dx;
      game.columns = game.columns.filter((col) => col.x > -CONFIG.columnWidth - 10);
      const last = game.columns[game.columns.length - 1];
      if (!last || last.x < W - CONFIG.columnSpacing) {
        spawnColumn((last ? last.x : W) + CONFIG.columnSpacing);
      }

      p.propSpeed += (16 - p.propSpeed) * Math.min(1, dt * 3);
      applyPhysics(dt, 0);

      // Score once Bolt's centre passes a column's trailing edge.
      for (const col of game.columns) {
        if (!col.passed && col.x + CONFIG.columnWidth < CONFIG.playerX) {
          col.passed = true;
          game.score++;
          sound.score();
        }
      }

      // Collisions: ground, ceiling, crystals.
      const hr = R - CONFIG.hitboxForgiveness;
      if (p.y + R >= GROUND_Y) {
        p.y = GROUND_Y - R;
        crash();
        endRun();
      } else if (p.y - hr <= 0) {
        p.y = hr;
        p.vy = 0;
        crash();
      } else if (game.columns.some((col) => hitsColumn(col, CONFIG.playerX, p.y, hr))) {
        crash();
      }
      break;
    }

    case 'dying': {
      // World freezes; Bolt drops to the ground nose-first.
      p.propSpeed += (0 - p.propSpeed) * Math.min(1, dt * 2);
      applyPhysics(dt, 0.6);
      if (p.y + R >= GROUND_Y) {
        p.y = GROUND_Y - R;
        endRun();
      }
      break;
    }

    case 'over': {
      game.overTimer += dt;
      p.propSpeed += (0 - p.propSpeed) * Math.min(1, dt * 2);
      break;
    }
  }
}

/* =====================================================================
   Render
   ===================================================================== */
function drawReadyScreen(c) {
  drawText(c, 'SKYBOLT', W / 2, 150, 62);
  drawText(c, 'Fly Bolt through the crystals', W / 2, 202, 18);

  drawPanel(c, 90, 400, W - 180, 130);
  const pulse = 0.6 + 0.4 * Math.sin(game.time * 4);
  c.globalAlpha = pulse;
  drawSmallText(c, 'Tap, click or Space to flap', W / 2, 432, 18, PALETTE.crystalLight);
  c.globalAlpha = 1;
  drawSmallText(c, 'M to mute', W / 2, 462, 14);
  drawSmallText(c, `Best: ${game.best}`, W / 2, 498, 20, PALETTE.propLight);
}

function drawGameOverScreen(c) {
  // Slide the panel in from above.
  const t = Math.min(1, game.overTimer / 0.35);
  const ease = 1 - Math.pow(1 - t, 3);
  const y0 = -280 + ease * 450;

  c.fillStyle = PALETTE.dim;
  c.globalAlpha = ease;
  c.fillRect(0, 0, W, H);
  c.globalAlpha = 1;
  drawPanel(c, 70, y0, W - 140, 270);
  drawText(c, 'GAME OVER', W / 2, y0 + 48, 40);

  drawSmallText(c, 'SCORE', W / 2 - 80, y0 + 105, 15, PALETTE.crystalLight);
  drawSmallText(c, 'BEST', W / 2 + 80, y0 + 105, 15, PALETTE.crystalLight);
  drawText(c, game.score, W / 2 - 80, y0 + 145, 44);
  drawText(c, game.best, W / 2 + 80, y0 + 145, 44, PALETTE.propLight);

  if (game.newBest) {
    const s = 1 + 0.06 * Math.sin(game.time * 8);
    c.save();
    c.translate(W / 2, y0 + 192);
    c.scale(s, s);
    drawText(c, 'NEW BEST!', 0, 0, 22, PALETTE.crystalMid);
    c.restore();
  }

  if (game.overTimer >= CONFIG.restartDelay) {
    c.globalAlpha = 0.6 + 0.4 * Math.sin(game.time * 4);
    drawSmallText(c, 'Tap or Space to retry', W / 2, y0 + 240, 17, PALETTE.crystalLight);
    c.globalAlpha = 1;
  }
}

function render(c) {
  const p = game.player;

  c.save();
  if (game.shake > 0) {
    const m = (game.shake / 0.35) * 6;
    c.translate((Math.random() - 0.5) * m, (Math.random() - 0.5) * m);
  }

  drawBackground(c, game.time, game.scroll);
  for (const col of game.columns) {
    drawColumnPair(c, col.x, col.gapTop, col.gapBottom, game.time + col.sparkle);
  }
  drawGround(c, game.scroll);

  const dead = game.state === 'dying' || game.state === 'over';
  const eye = dead ? 'ko' : game.time % 3.2 < 0.12 ? 'blink' : 'open';
  drawPlayer(c, CONFIG.playerX, p.y, p.angle, p.prop, p.flap, eye);
  c.restore();

  if (game.flash > 0) {
    c.fillStyle = `rgba(255, 245, 235, ${game.flash * 0.6})`;
    c.fillRect(0, 0, W, H);
  }

  if (game.state === 'ready') drawReadyScreen(c);
  if (game.state === 'playing' || game.state === 'dying') drawScore(c, game.score, W / 2, 70, 56);
  if (game.state === 'over') drawGameOverScreen(c);

  drawSoundIcon(c, MUTE_BUTTON.x, MUTE_BUTTON.y, sound.muted);
}

/* =====================================================================
   Input — mouse, touch and pen via pointer events, plus keyboard.
   ===================================================================== */
const MUTE_BUTTON = { x: W - 36, y: 36, r: 24 };

function handlePress() {
  sound.init(); // first gesture unlocks audio
  if (game.state === 'ready') startGame();
  else if (game.state === 'playing') flap();
  else if (game.state === 'over' && game.overTimer >= CONFIG.restartDelay) resetGame();
}

// Convert a screen position to logical 480x720 coordinates.
function toLogical(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: ((clientX - rect.left) / rect.width) * W,
    y: ((clientY - rect.top) / rect.height) * H,
  };
}

// Listen on the whole window so taps on the letterbox area also count.
window.addEventListener('pointerdown', (e) => {
  if (e.button > 0) return; // left click / touch only
  e.preventDefault();
  const pt = toLogical(e.clientX, e.clientY);
  if (Math.hypot(pt.x - MUTE_BUTTON.x, pt.y - MUTE_BUTTON.y) <= MUTE_BUTTON.r) {
    sound.init();
    sound.toggleMute();
    return;
  }
  handlePress();
}, { passive: false });

window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
    e.preventDefault(); // stop the page from scrolling
    if (!e.repeat) handlePress();
  } else if (e.code === 'KeyM' && !e.repeat) {
    sound.init();
    sound.toggleMute();
  }
});

// Block the long-press context menu on mobile.
window.addEventListener('contextmenu', (e) => e.preventDefault());

/* =====================================================================
   Main loop — fixed timestep so the game plays identically on 60, 120
   or 144 Hz screens. Rendering happens once per display frame.
   ===================================================================== */
const STEP = 1 / 120;
let accumulator = 0;
let lastTime = performance.now();

function frame(now) {
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (dt > 0.25) dt = 0.25; // avoid a huge catch-up after tab switches
  accumulator += dt;
  while (accumulator >= STEP) {
    update(STEP);
    accumulator -= STEP;
  }
  render(ctx);
  requestAnimationFrame(frame);
}

resetGame();
requestAnimationFrame(frame);
</script>
</body>
