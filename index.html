<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Clutch</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #120c24;
    overflow: hidden;
    touch-action: none;           /* no scroll/zoom gestures on mobile */
    -webkit-user-select: none;
    user-select: none;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    image-rendering: auto;
  }
</style>
</head>
<body>
<canvas id="game" aria-label="Clutch game"></canvas>
<script>
'use strict';

/* =====================================================================
   CONFIG — tune the game from here.
   All sizes are in logical pixels on a fixed 480x720 playfield; the
   canvas is scaled to fit the screen, so these never change per device.
   ===================================================================== */
const CONFIG = {
  width: 480,
  height: 720,
  groundHeight: 96,

  // --- Player physics (px, px/s, px/s²) ---
  playerX: 130,           // Clutch's fixed horizontal position
  readyY: 300,            // where Clutch hovers on the start screen
  gravity: 1650,          // downward acceleration
  flapVelocity: -480,     // vertical speed set on each flap (negative = up)
  maxFallSpeed: 650,      // terminal falling speed
  maxTiltUp: -0.45,       // radians, nose-up tilt after a flap
  maxTiltDown: 1.3,       // radians, nose-down tilt when falling fast
  tiltResponse: 10,       // how quickly the tilt follows velocity
  hitboxForgiveness: 3,   // player hitbox is this many px smaller than the art
  wingBeatSpeed: 16,      // wing-beat speed while gliding (radians/s; 2π = one beat)
  flapWingSpeed: 30,      // wing-beat speed right after a flap

  // --- Speed & difficulty ---
  startSpeed: 150,        // world scroll speed at score 0 (px/s)
  maxSpeed: 220,          // speed never goes above this
  speedPerPoint: 2,       // extra speed for each point scored
  startGap: 720 * 0.25,   // opening between stumps at score 0: 25% of the playfield height
  minGap: 150,            // the opening never gets smaller than this
  gapPerPoint: 1,         // opening shrinks by this much per point
  // Centre-to-centre distance between stump pairs, picked at random for
  // each pair from this range: 34%–49% of the playfield width.
  spacingMin: 480 * 0.34,
  spacingMax: 480 * 0.49,
  gapEdgeMargin: 70,      // min distance from an opening to ceiling/ground
  // How far the opening may move between neighbouring pairs depends on
  // the time Clutch has to get there: these are safe climb / drop rates.
  climbRate: 180,         // px/s Clutch can comfortably rise by tapping
  dropRate: 260,          // px/s Clutch can comfortably fall

  // --- Feel ---
  restartDelay: 0.6,      // seconds before the game-over screen accepts input
  volume: 0.6,            // master sound volume (0..1)

  // --- Scrolling ---
  campusScrollRatio: 0.3, // campus moves at 30% of the obstacle speed (ground moves at 100%)

  // Obstacle look
  columnWidth: 480 * 0.08, // stump trunk width: 8% of the playfield width
  pixelSize: 3,           // size of one art pixel in the ground strip (logical px)

  // Player look
  playerRadius: 18,
};

/* Colour palette for Clutch and the UI. Background and ground colours for the
   day and night themes live in THEMES further down. */
const PALETTE = {
  // UI accents (Lehigh brown and gold)
  accentLight: '#ffe6a8',
  accentMid: '#ffc93a',

  // Clutch the Mountain Hawk: brown and white with a gold beak.
  hawkBody: '#6b3a1a',
  hawkLight: '#9a6337',
  hawkShade: '#43220c',
  hawkWing: '#55301a',
  hawkWingEdge: '#a8743f',
  hawkOutline: '#241108',
  hawkWhite: '#fbf6ec',
  hawkBelly: '#efdcbc',
  hawkStreak: '#8a5530',
  beak: '#f5b82e',
  beakShade: '#d08f16',
  iris: '#ffc93a',
  gold: '#ffd36b',

  text: '#fff1dc',
  textOutline: '#2a1610',
  panel: 'rgba(43, 26, 16, 0.72)',
  panelSolid: 'rgba(43, 26, 16, 0.92)',
  dim: 'rgba(20, 12, 6, 0.35)',
};

const W = CONFIG.width;
const H = CONFIG.height;
const GROUND_Y = H - CONFIG.groundHeight;
const FONT = "'Trebuchet MS', 'Segoe UI', system-ui, sans-serif";

/* =====================================================================
   Canvas setup and responsive scaling
   ===================================================================== */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// Fit the canvas inside the window while keeping the 2:3 aspect ratio,
// and render at device-pixel resolution so it stays crisp on phones.
function resize() {
  const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
  const cssW = Math.floor(W * scale);
  const cssH = Math.floor(H * scale);
  canvas.style.width = cssW + 'px';
  canvas.style.height = cssH + 'px';
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);
  // After this, all drawing uses logical 480x720 coordinates.
  ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
}
window.addEventListener('resize', resize);
resize();

/* =====================================================================
   Small helpers
   ===================================================================== */

// Deterministic PRNG so the scenery looks the same on every load.
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function roundRectPath(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

// Positive modulo, for wrapping scroll offsets.
function wrap(v, m) {
  return ((v % m) + m) % m;
}

/* =====================================================================
   Themes — day (light) and night (dark).
   Day shows the autumn campus, night the winter-night campus. The ground
   strip is pixel art in each theme's colours.
   ===================================================================== */
const THEMES = {
  light: {
    campus: 'backgrounds/campus-autumn.jpg',
    sky: '#8bbcfa',                        // matches the image's sky; also the page colour
    grass: '#5cb84a', grassLight: '#8fd46a', grassDark: '#3a8a34',
    dirt: '#9a6a44', dirtLight: '#b8875a', dirtDark: '#6e4a2e',
    stone: '#c9b597', stoneDark: '#8f7c64',
  },
  dark: {
    campus: 'backgrounds/campus-winter-night.jpg',
    sky: '#0c1c53',
    grass: '#2f6e34', grassLight: '#46904a', grassDark: '#1c4a20',
    dirt: '#4a3222', dirtLight: '#5e412c', dirtDark: '#2e1e13',
    stone: '#6e6252', stoneDark: '#463c30',
  },
};

// Current theme. A saved choice wins; otherwise follow the device setting.
const THEME_KEY = 'flap-game.theme';
let themeName = (() => {
  try {
    const saved = localStorage.getItem(THEME_KEY);
    if (saved === 'light' || saved === 'dark') return saved;
  } catch (e) { /* storage unavailable */ }
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
})();
const theme = () => THEMES[themeName];

function applyPageColour() {
  document.documentElement.style.background = theme().sky;
  document.body.style.background = theme().sky;
}

function toggleTheme() {
  themeName = themeName === 'light' ? 'dark' : 'light';
  try { localStorage.setItem(THEME_KEY, themeName); } catch (e) { /* ignore */ }
  applyPageColour();
}
applyPageColour();

/* =====================================================================
   Campus background. The picture is scaled so its bottom edge sits on
   the ground line, then looped as  picture | mirrored picture | ...  so
   the edges always meet seamlessly. It scrolls at
   CONFIG.campusScrollRatio × the obstacle speed (see update()).
   ===================================================================== */
const CAMPUS = {
  light: loadImage(THEMES.light.campus),
  dark: loadImage(THEMES.dark.campus),
};

// Width of one copy of the picture on screen, and of one full loop.
function campusWidth(img) {
  return (img.naturalWidth * GROUND_Y) / img.naturalHeight;
}
function campusLoopWidth() {
  const img = CAMPUS[themeName];
  return imageReady(img) ? campusWidth(img) * 2 : 0;
}

function drawBackground(c, campusScroll) {
  const img = CAMPUS[themeName];
  c.fillStyle = theme().sky;
  c.fillRect(0, 0, W, GROUND_Y);
  if (!imageReady(img)) return;
  const w = campusWidth(img);
  const loop = w * 2;
  for (let x = -wrap(campusScroll, loop); x < W; x += loop) {
    c.drawImage(img, x, 0, w, GROUND_Y);
    // Mirrored copy: its left edge is the picture's right edge, and so on.
    c.save();
    c.translate(x + loop, 0);
    c.scale(-1, 1);
    c.drawImage(img, 0, 0, w, GROUND_Y);
    c.restore();
  }
}

/* =====================================================================
   Ground strip — pixel-art grass and dirt, painted once per theme at
   "art resolution" (1 art pixel = CONFIG.pixelSize logical px) and drawn
   scaled up without smoothing, matching Clutch's pixel style.
   ===================================================================== */
const PX = CONFIG.pixelSize;
const ART_W = W / PX;                         // 160 art px across the screen
const GROUND_ROWS = CONFIG.groundHeight / PX; // 32 rows of grass and dirt
const BLADE_ROWS = 3;                         // grass blades poke above the ground line
const GROUND_TILE = 32;                       // art px; the pattern repeats this often

// Small canvas plus a one-pixel "plot" helper.
function pixelCanvas(w, h) {
  const cv = document.createElement('canvas');
  cv.width = w;
  cv.height = h;
  const g = cv.getContext('2d');
  const plot = (x, y, colour) => { g.fillStyle = colour; g.fillRect(x, y, 1, 1); };
  return { cv, g, plot };
}

function buildGround(T) {
  const rnd = mulberry32(99);
  const rows = GROUND_ROWS + BLADE_ROWS;
  const tile = pixelCanvas(GROUND_TILE, rows);
  const { g, plot } = tile;
  for (let x = 0; x < GROUND_TILE; x++) {
    const blade = Math.floor(rnd() * 3);                    // 0..2 px tall
    const hang = rnd() < 0.3 ? 1 : rnd() < 0.15 ? 2 : 0;     // turf hanging into dirt
    const turfEnd = BLADE_ROWS + 5 + hang;
    // Dirt, darkening with depth.
    for (let y = turfEnd; y < rows; y++) {
      let col = T.dirt;
      if (y > rows - 6 || (y > rows - 12 && (x + y) % 2 === 0)) col = T.dirtDark;
      plot(x, y, col);
    }
    // Turf with a dark top edge and dark lower lip.
    const top = BLADE_ROWS - blade;
    for (let y = top; y < turfEnd; y++) plot(x, y, T.grass);
    plot(x, top, T.grassDark);
    plot(x, top + 1, T.grassLight);
    plot(x, turfEnd - 1, T.grassDark);
  }
  // Light specks and small stones in the dirt.
  for (let i = 0; i < 16; i++) {
    plot(Math.floor(rnd() * GROUND_TILE), BLADE_ROWS + 9 + Math.floor(rnd() * 16), T.dirtLight);
  }
  for (let i = 0; i < 3; i++) {
    const sx = 1 + Math.floor(rnd() * (GROUND_TILE - 4));
    const sy = BLADE_ROWS + 11 + Math.floor(rnd() * 12);
    g.fillStyle = T.stone;
    g.fillRect(sx, sy, 3, 2);
    plot(sx + 2, sy + 1, T.stoneDark);
    plot(sx, sy + 2, T.stoneDark); plot(sx + 1, sy + 2, T.stoneDark); plot(sx + 2, sy + 2, T.stoneDark);
  }
  // Copy the tile across a strip one screen + one tile wide.
  const width = ART_W + GROUND_TILE;
  const strip = pixelCanvas(width, rows);
  for (let x = 0; x < width; x += GROUND_TILE) strip.g.drawImage(tile.cv, x, 0);
  return strip.cv;
}
const GROUND = { light: buildGround(THEMES.light), dark: buildGround(THEMES.dark) };

function drawGround(c, scroll) {
  const img = GROUND[themeName];
  c.save();
  c.imageSmoothingEnabled = false;
  c.drawImage(img, -wrap(scroll, GROUND_TILE * PX), GROUND_Y - BLADE_ROWS * PX, img.width * PX, img.height * PX);
  c.restore();
}

/* =====================================================================
   Tree-stump obstacles. Each stump is two images: the cut end ("cap"),
   always drawn at its original proportions, and a bark section that is
   repeated as many times as needed to reach the ceiling or the ground.
   ===================================================================== */
const STUMP = {
  bottomCap: loadImage('sprites/stump-bottom-cap.png'),   // cut end on top
  bottomBark: loadImage('sprites/stump-bottom-bark.png'),
  topCap: loadImage('sprites/stump-top-cap.png'),         // cut end underneath
  topBark: loadImage('sprites/stump-top-bark.png'),
  // The trunk itself is this fraction of the image width; the rest is the
  // knobbly bark edge. CONFIG.columnWidth is the trunk (and hitbox) width.
  bodyFraction: 205 / 222,
};

function stumpImagesReady() {
  return [STUMP.bottomCap, STUMP.bottomBark, STUMP.topCap, STUMP.topBark].every(imageReady);
}

// Drawn width of a stump image and the height an image gets at that width.
function stumpDrawWidth() {
  return CONFIG.columnWidth / STUMP.bodyFraction;
}
function scaledHeight(img, w) {
  return (w * img.naturalHeight) / img.naturalWidth;
}

// A pair of stumps sharing one centre line: one hanging from the top with
// its cut end at gapTop, one standing on the ground with its cut end at
// gapBottom.
function drawStumpPair(c, col) {
  const tw = CONFIG.columnWidth;
  if (!stumpImagesReady()) {
    // Plain fallback while the images load.
    c.fillStyle = '#7a4a2a';
    c.fillRect(col.x, 0, tw, col.gapTop);
    c.fillRect(col.x, col.gapBottom, tw, GROUND_Y - col.gapBottom);
    return;
  }
  const dw = stumpDrawWidth();
  const dx = col.x + tw / 2 - dw / 2; // centre the image on the trunk

  // Bottom stump: bark tiles from under the cap down past the ground line
  // (the ground strip covers the rest), then the cap on top.
  const bCapH = scaledHeight(STUMP.bottomCap, dw);
  const bBarkH = scaledHeight(STUMP.bottomBark, dw);
  for (let y = col.gapBottom + bCapH - 1; y < GROUND_Y + BLADE_ROWS * PX; y += bBarkH - 1) {
    c.drawImage(STUMP.bottomBark, dx, y, dw, bBarkH);
  }
  c.drawImage(STUMP.bottomCap, dx, col.gapBottom, dw, bCapH);

  // Top stump: bark tiles upward from above the cap until off-screen.
  const tCapH = scaledHeight(STUMP.topCap, dw);
  const tBarkH = scaledHeight(STUMP.topBark, dw);
  for (let y = col.gapTop - tCapH + 1 - tBarkH; y + tBarkH > 0; y -= tBarkH - 1) {
    c.drawImage(STUMP.topBark, dx, y, dw, tBarkH);
  }
  c.drawImage(STUMP.topCap, dx, col.gapTop - tCapH, dw, tCapH);
}

/* =====================================================================
   Draw functions — the player: "Clutch", a Mountain Hawk
   ===================================================================== */

// One wing in local space: pivot at (0,0), feathers pointing back (-x).
// Positive rotation lifts the wing tip.
function drawWing(c, px, py, rot, fill, edge) {
  c.save();
  c.translate(px, py);
  c.rotate(rot);
  c.beginPath();
  c.moveTo(3, -4);
  c.quadraticCurveTo(-10, -13, -25, -7);   // leading edge to wing tip
  c.lineTo(-19, -3);                        // feather notches
  c.lineTo(-24, 0);
  c.lineTo(-17, 1.5);
  c.lineTo(-21, 5);
  c.quadraticCurveTo(-8, 7, 3, 4);          // trailing edge back to body
  c.closePath();
  c.fillStyle = fill;
  c.fill();
  c.strokeStyle = PALETTE.hawkOutline;
  c.lineWidth = 2;
  c.stroke();
  // Lighter covert feathers along the leading edge.
  c.strokeStyle = edge;
  c.lineWidth = 2.5;
  c.beginPath();
  c.moveTo(0, -3.5);
  c.quadraticCurveTo(-9, -9.5, -18, -6.5);
  c.stroke();
  c.restore();
}

// Fanned tail feathers with pale tips.
function drawTail(c, flap) {
  const R = CONFIG.playerRadius;
  c.save();
  c.translate(-R + 5, 3);
  c.rotate(-0.15 - flap * 0.3);
  for (const a of [-0.35, 0, 0.35]) {
    c.save();
    c.rotate(a);
    c.beginPath();
    c.moveTo(0, -3.5);
    c.lineTo(-15, -4.5);
    c.quadraticCurveTo(-19, 0, -15, 4.5);
    c.lineTo(0, 3.5);
    c.closePath();
    c.fillStyle = PALETTE.hawkShade;
    c.fill();
    c.strokeStyle = PALETTE.hawkOutline;
    c.lineWidth = 1.6;
    c.stroke();
    c.fillStyle = PALETTE.hawkWhite;
    c.fillRect(-16, -3, 3, 6);
    c.restore();
  }
  c.restore();
}

/**
 * @param x,y      centre of the hawk
 * @param angle    body tilt in radians (+ = nose down)
 * @param wing     wing-beat phase in radians
 * @param flap     0..1 amount right after a flap (wings slam down)
 * @param eye      'open' | 'blink' | 'ko' (knocked out after a crash)
 */
function drawVectorHawk(c, x, y, angle, wing, flap, eye) {
  const R = CONFIG.playerRadius;
  // Steady wing beat, plus a hard downstroke right after each flap.
  const wingRot = 0.25 + Math.sin(wing) * 0.45 - flap * 1.1;

  c.save();
  c.translate(x, y);
  c.rotate(angle);
  c.scale(1 + flap * 0.08, 1 - flap * 0.08);

  drawTail(c, flap);
  // Far wing peeks out behind the body.
  drawWing(c, -1, -5, wingRot + 0.25, PALETTE.hawkShade, PALETTE.hawkWing);

  // Talons tucked under the body.
  c.fillStyle = PALETTE.beak;
  c.strokeStyle = PALETTE.hawkOutline;
  c.lineWidth = 1.5;
  for (const fx of [0, 7]) {
    c.beginPath();
    c.ellipse(fx, R - 1, 3.2, 4, 0, 0, Math.PI * 2);
    c.fill();
    c.stroke();
  }

  // Crest feathers ruffled at the back of the head.
  c.fillStyle = PALETTE.hawkBody;
  for (const [cx, h] of [[-6, 7], [0, 9], [6, 6]]) {
    c.beginPath();
    c.moveTo(cx - 4, -R + 4);
    c.lineTo(cx - 6, -R - h + 4);
    c.lineTo(cx + 4, -R + 3);
    c.closePath();
    c.fill();
    c.stroke();
  }

  // Body.
  const g = c.createRadialGradient(-5, -8, 2, 0, 0, R + 2);
  g.addColorStop(0, PALETTE.hawkLight);
  g.addColorStop(0.55, PALETTE.hawkBody);
  g.addColorStop(1, PALETTE.hawkShade);
  c.fillStyle = g;
  c.beginPath();
  c.ellipse(0, 0, R + 1, R - 1, 0, 0, Math.PI * 2);
  c.fill();

  // White head and pale streaked chest (clipped to the body).
  c.save();
  c.beginPath();
  c.ellipse(0, 0, R + 1, R - 1, 0, 0, Math.PI * 2);
  c.clip();
  c.fillStyle = PALETTE.hawkBelly;
  c.beginPath();
  c.ellipse(6, 11, 13, 9, -0.3, 0, Math.PI * 2);
  c.fill();
  c.strokeStyle = PALETTE.hawkStreak;
  c.lineWidth = 1.4;
  for (const [sx, sy] of [[2, 10], [8, 8], [6, 14], [12, 12]]) {
    c.beginPath();
    c.moveTo(sx - 2, sy - 1.5);
    c.lineTo(sx, sy);
    c.lineTo(sx + 2, sy - 1.5);
    c.stroke();
  }
  c.fillStyle = PALETTE.hawkWhite;
  c.beginPath();
  c.ellipse(8, -7, 12, 9.5, 0.15, 0, Math.PI * 2);
  c.fill();
  c.restore();

  c.strokeStyle = PALETTE.hawkOutline;
  c.lineWidth = 2;
  c.beginPath();
  c.ellipse(0, 0, R + 1, R - 1, 0, 0, Math.PI * 2);
  c.stroke();

  // Hooked beak: upper bill, then the shorter lower bill.
  c.lineWidth = 1.6;
  c.fillStyle = PALETTE.beakShade;
  c.beginPath();
  c.moveTo(14, -1.5);
  c.lineTo(21, -1);
  c.lineTo(15, 2.5);
  c.closePath();
  c.fill();
  c.stroke();
  c.fillStyle = PALETTE.beak;
  c.beginPath();
  c.moveTo(13, -7.5);
  c.lineTo(21, -7);
  c.quadraticCurveTo(26.5, -5.5, 25, 0.5);   // hook tip
  c.lineTo(22, -1.8);
  c.lineTo(14, -1.5);
  c.closePath();
  c.fill();
  c.stroke();
  c.fillStyle = PALETTE.hawkOutline;
  c.beginPath();
  c.arc(17.5, -5, 0.9, 0, Math.PI * 2);
  c.fill();

  // Eye with a fierce brow.
  const ex = 10, ey = -7;
  if (eye === 'blink') {
    c.strokeStyle = PALETTE.hawkOutline;
    c.lineWidth = 2;
    c.beginPath();
    c.moveTo(ex - 3.5, ey);
    c.lineTo(ex + 3.5, ey);
    c.stroke();
  } else if (eye === 'ko') {
    c.strokeStyle = PALETTE.hawkOutline;
    c.lineWidth = 2;
    c.lineCap = 'round';
    c.beginPath();
    c.moveTo(ex - 3, ey - 3); c.lineTo(ex + 3, ey + 3);
    c.moveTo(ex + 3, ey - 3); c.lineTo(ex - 3, ey + 3);
    c.stroke();
    c.lineCap = 'butt';
  } else {
    c.fillStyle = PALETTE.iris;
    c.beginPath();
    c.arc(ex, ey, 3.6, 0, Math.PI * 2);
    c.fill();
    c.strokeStyle = PALETTE.hawkOutline;
    c.lineWidth = 1.2;
    c.stroke();
    c.fillStyle = PALETTE.hawkOutline;
    c.beginPath();
    c.arc(ex + 0.8, ey, 1.9, 0, Math.PI * 2);
    c.fill();
    c.fillStyle = '#ffffff';
    c.beginPath();
    c.arc(ex + 1.6, ey - 1.2, 0.8, 0, Math.PI * 2);
    c.fill();
  }
  if (eye !== 'ko') {
    // Brow slants down toward the beak for a determined look.
    c.strokeStyle = PALETTE.hawkShade;
    c.lineWidth = 3;
    c.lineCap = 'round';
    c.beginPath();
    c.moveTo(ex - 5, ey - 6);
    c.lineTo(ex + 5, ey - 3);
    c.stroke();
    c.lineCap = 'butt';
  }

  // Near wing on top.
  drawWing(c, -3, 0, wingRot, PALETTE.hawkWing, PALETTE.hawkWingEdge);

  c.restore();
}

/* =====================================================================
   Clutch sprite (image frames). Falls back to the drawn hawk above if
   the images are missing or haven't loaded yet.
   ===================================================================== */
const SPRITE = {
  // Wing-beat cycle, in order: up, level, down, level (frame 2 is reused).
  frames: ['sprites/clutch-1.png', 'sprites/clutch-2.png', 'sprites/clutch-3.png', 'sprites/clutch-2.png'],
  koFrame: null,     // optional image shown after a crash, e.g. 'sprites/clutch-ko.png'
  width: 72,         // drawn width in logical px; height keeps the image's aspect ratio
  // The point in the image (0..1 across, 0..1 down) that sits on the hitbox centre.
  anchorX: 0.63,
  anchorY: 0.57,
};

function loadImage(src) {
  const img = new Image();
  img.src = src;
  return img;
}
const spriteFrames = SPRITE.frames.map(loadImage);
const spriteKo = SPRITE.koFrame ? loadImage(SPRITE.koFrame) : null;

function imageReady(img) {
  return img && img.complete && img.naturalWidth > 0;
}

/**
 * Draws Clutch. Same parameters as drawVectorHawk. The wing phase picks
 * the animation frame; tilt and flap squash are applied in code.
 */
function drawPlayer(c, x, y, angle, wing, flap, eye) {
  if (!spriteFrames.length || !spriteFrames.every(imageReady)) {
    drawVectorHawk(c, x, y, angle, wing, flap, eye);
    return;
  }
  let img;
  if (eye === 'ko' && imageReady(spriteKo)) {
    img = spriteKo;
  } else {
    const cycle = wrap(wing, Math.PI * 2) / (Math.PI * 2); // 0..1 through a wing beat
    img = spriteFrames[Math.floor(cycle * spriteFrames.length) % spriteFrames.length];
  }
  const w = SPRITE.width;
  const h = (w * img.naturalHeight) / img.naturalWidth;

  c.save();
  c.translate(x, y);
  c.rotate(angle);
  c.scale(1 + flap * 0.08, 1 - flap * 0.08);
  c.drawImage(img, -w * SPRITE.anchorX, -h * SPRITE.anchorY, w, h);
  c.restore();
}

/* =====================================================================
   Draw functions — HUD
   ===================================================================== */
// Outlined, centred text used for the score and panel headings.
function drawText(c, text, x, y, size, color = PALETTE.text) {
  c.font = `bold ${size}px ${FONT}`;
  c.textAlign = 'center';
  c.textBaseline = 'middle';
  c.lineJoin = 'round';
  c.lineWidth = Math.max(3, size * 0.16);
  c.strokeStyle = PALETTE.textOutline;
  c.strokeText(String(text), x, y);
  c.fillStyle = color;
  c.fillText(String(text), x, y);
}

function drawScore(c, value, x, y, size) {
  drawText(c, value, x, y, size);
}

// Plain (un-outlined) small text for use inside panels.
function drawSmallText(c, text, x, y, size, color = PALETTE.text) {
  c.font = `bold ${size}px ${FONT}`;
  c.textAlign = 'center';
  c.textBaseline = 'middle';
  c.fillStyle = color;
  c.fillText(text, x, y);
}

function drawPanel(c, x, y, w, h) {
  c.fillStyle = PALETTE.panelSolid;
  roundRectPath(c, x, y, w, h, 18);
  c.fill();
  c.strokeStyle = PALETTE.accentMid;
  c.lineWidth = 2;
  c.stroke();
}

function drawSoundIcon(c, x, y, muted) {
  c.fillStyle = PALETTE.panel;
  c.beginPath();
  c.arc(x, y, 20, 0, Math.PI * 2);
  c.fill();
  c.fillStyle = PALETTE.text;
  c.beginPath();
  c.moveTo(x - 10, y - 4);
  c.lineTo(x - 5, y - 4);
  c.lineTo(x + 1, y - 10);
  c.lineTo(x + 1, y + 10);
  c.lineTo(x - 5, y + 4);
  c.lineTo(x - 10, y + 4);
  c.closePath();
  c.fill();
  c.strokeStyle = PALETTE.text;
  c.lineWidth = 2;
  c.lineCap = 'round';
  c.beginPath();
  if (muted) {
    c.moveTo(x + 5, y - 5); c.lineTo(x + 12, y + 5);
    c.moveTo(x + 12, y - 5); c.lineTo(x + 5, y + 5);
  } else {
    c.arc(x + 2, y, 6, -0.9, 0.9);
    c.moveTo(x + 2 + 11 * Math.cos(-0.9), y + 11 * Math.sin(-0.9));
    c.arc(x + 2, y, 11, -0.9, 0.9);
  }
  c.stroke();
  c.lineCap = 'butt';
}

// Day/night button. Shows a moon in day mode (tap for night) and a sun
// at night (tap for day).
function drawThemeIcon(c, x, y, name) {
  c.fillStyle = PALETTE.panel;
  c.beginPath();
  c.arc(x, y, 20, 0, Math.PI * 2);
  c.fill();
  c.fillStyle = PALETTE.text;
  if (name === 'light') {
    // Crescent moon: a disc with an offset disc cut out of it.
    c.save();
    c.beginPath();
    c.arc(x, y, 9, 0, Math.PI * 2);
    c.clip();
    c.beginPath();
    c.rect(x - 10, y - 10, 20, 20);
    c.arc(x + 5, y - 4, 8, 0, Math.PI * 2);
    c.fill('evenodd');
    c.restore();
  } else {
    c.beginPath();
    c.arc(x, y, 5.5, 0, Math.PI * 2);
    c.fill();
    c.strokeStyle = PALETTE.text;
    c.lineWidth = 2;
    c.lineCap = 'round';
    c.beginPath();
    for (let k = 0; k < 8; k++) {
      const a = (k * Math.PI) / 4;
      c.moveTo(x + Math.cos(a) * 9, y + Math.sin(a) * 9);
      c.lineTo(x + Math.cos(a) * 12, y + Math.sin(a) * 12);
    }
    c.stroke();
    c.lineCap = 'butt';
  }
}

function drawLabel(c, text, x, y) {
  c.font = `bold 13px ${FONT}`;
  c.textAlign = 'center';
  c.textBaseline = 'middle';
  const w = c.measureText(text).width + 16;
  c.fillStyle = PALETTE.panel;
  roundRectPath(c, x - w / 2, y - 11, w, 22, 11);
  c.fill();
  c.fillStyle = PALETTE.text;
  c.fillText(text, x, y + 1);
}


/* =====================================================================
   Persistence (high score + mute) — localStorage can throw in private
   mode, so every access is guarded.
   ===================================================================== */
const STORAGE = { best: 'flap-game.best', muted: 'flap-game.muted' };

function loadNumber(key) {
  try { return Number(localStorage.getItem(key)) || 0; } catch (e) { return 0; }
}
function saveValue(key, value) {
  try { localStorage.setItem(key, String(value)); } catch (e) { /* ignore */ }
}

/* =====================================================================
   Sound — tiny synthesized effects with the Web Audio API.
   The AudioContext is created on the first input (browser autoplay rules).
   ===================================================================== */
const sound = {
  ctx: null,
  master: null,
  muted: loadNumber(STORAGE.muted) === 1,

  init() {
    if (this.ctx) {
      if (this.ctx.state === 'suspended') this.ctx.resume();
      return;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = this.muted ? 0 : CONFIG.volume;
    this.master.connect(this.ctx.destination);
  },

  toggleMute() {
    this.muted = !this.muted;
    saveValue(STORAGE.muted, this.muted ? 1 : 0);
    if (this.master) {
      this.master.gain.setValueAtTime(this.muted ? 0 : CONFIG.volume, this.ctx.currentTime);
    }
  },

  ready() {
    return this.ctx && !this.muted;
  },

  // One oscillator note with a pitch sweep and a quick fade-out.
  tone(type, f0, f1, dur, vol, delay = 0) {
    const t = this.ctx.currentTime + delay;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(f0, t);
    osc.frequency.exponentialRampToValueAtTime(f1, t + dur);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(this.master);
    osc.start(t);
    osc.stop(t + dur + 0.02);
  },

  // Low-passed white-noise burst (used for the crash).
  noise(dur, vol) {
    const t = this.ctx.currentTime;
    const len = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    const filter = this.ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 1100;
    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(filter).connect(gain).connect(this.master);
    src.start(t);
  },

  flap() {
    if (!this.ready()) return;
    this.tone('triangle', 420, 780, 0.09, 0.25);
  },
  score() {
    if (!this.ready()) return;
    this.tone('sine', 880, 880, 0.09, 0.18);
    this.tone('sine', 1320, 1320, 0.16, 0.18, 0.08);
  },
  hit() {
    if (!this.ready()) return;
    this.noise(0.28, 0.5);
    this.tone('square', 220, 50, 0.32, 0.15);
  },
};

/* =====================================================================
   Game state
   ===================================================================== */
// States: 'ready' (start screen) → 'playing' → 'dying' (falling after a
// crash) → 'over' (game-over screen) → back to 'ready'.
const game = {
  state: 'ready',
  time: 0,
  scroll: 0,          // distance the ground and stumps have scrolled
  campusScroll: 0,    // distance the campus background has scrolled (slower)
  speed: CONFIG.startSpeed,
  score: 0,
  best: loadNumber(STORAGE.best),
  newBest: false,
  columns: [],
  lastGapCenter: GROUND_Y / 2,
  overTimer: 0,       // time spent on the game-over screen
  shake: 0,           // screen-shake timer after a crash
  flash: 0,           // white flash after a crash
  player: null,
};

function resetGame() {
  game.state = 'ready';
  game.speed = CONFIG.startSpeed;
  game.score = 0;
  game.newBest = false;
  game.columns = [];
  game.lastGapCenter = GROUND_Y / 2;
  game.overTimer = 0;
  game.player = {
    y: CONFIG.readyY,
    vy: 0,
    angle: 0,
    wing: 0,          // wing-beat phase
    wingSpeed: CONFIG.wingBeatSpeed, // wing-beat speed (rad/s)
    flap: 0,          // 0..1 squash after a flap
  };
}

function startGame() {
  game.state = 'playing';
  spawnColumn(W + 120, 0);
  flap();
}

function flap() {
  const p = game.player;
  p.vy = CONFIG.flapVelocity;
  p.flap = 1;
  p.wingSpeed = CONFIG.flapWingSpeed;
  p.wing = Math.PI; // jump to the downstroke so every flap is visible
  sound.flap();
}

/* =====================================================================
   Obstacles
   ===================================================================== */
function currentGap() {
  return Math.max(CONFIG.minGap, CONFIG.startGap - game.score * CONFIG.gapPerPoint);
}

function randomSpacing() {
  return CONFIG.spacingMin + Math.random() * (CONFIG.spacingMax - CONFIG.spacingMin);
}

// Adds a stump pair at x. `spacing` is the centre-to-centre distance from
// the previous pair (0 for the first pair, which has plenty of lead-in).
function spawnColumn(x, spacing) {
  const gap = currentGap();
  // Keep the opening away from the ceiling and ground...
  const minC = CONFIG.gapEdgeMargin + gap / 2;
  const maxC = GROUND_Y - CONFIG.gapEdgeMargin - gap / 2;
  let lo = minC, hi = maxC;
  if (spacing > 0) {
    // ...and within reach of the previous opening. The time Clutch has is
    // the clear distance between the two trunks (minus Clutch's size) at
    // the speed the game will be going by then.
    const speed = Math.min(CONFIG.maxSpeed, game.speed + 2 * CONFIG.speedPerPoint);
    const clear = spacing - CONFIG.columnWidth - CONFIG.playerRadius * 2;
    const t = Math.max(0.2, clear / speed);
    lo = Math.max(minC, game.lastGapCenter - CONFIG.climbRate * t);
    hi = Math.min(maxC, game.lastGapCenter + CONFIG.dropRate * t);
  }
  const center = lo + Math.random() * (hi - lo);
  game.lastGapCenter = center;
  game.columns.push({
    x,
    gapTop: center - gap / 2,
    gapBottom: center + gap / 2,
    passed: false,
    next: randomSpacing(), // distance to the pair that will follow this one
  });
}

// Hitbox of one stump: the trunk rectangle with the corners at the cut
// end trimmed, since the round cut face doesn't fill them.
// dir = 1 for the bottom stump (grows down from tipY), -1 for the top one.
function stumpPolygon(x, tipY, dir) {
  const w = CONFIG.columnWidth;
  const cw = w * 0.15, ch = 5;                 // trimmed corner size
  const far = tipY + dir * (GROUND_Y + 100);   // well past the screen edge
  return [
    [x, far], [x, tipY + dir * ch], [x + cw, tipY],
    [x + w - cw, tipY], [x + w, tipY + dir * ch], [x + w, far],
  ];
}

/* =====================================================================
   Collision helpers
   ===================================================================== */
function distSqToSegment(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  const len = dx * dx + dy * dy;
  let t = len ? ((px - ax) * dx + (py - ay) * dy) / len : 0;
  t = Math.max(0, Math.min(1, t));
  const cx = ax + t * dx - px, cy = ay + t * dy - py;
  return cx * cx + cy * cy;
}

// True if a circle overlaps a (possibly concave) polygon.
function circleHitsPolygon(cx, cy, r, pts) {
  let inside = false;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const [xi, yi] = pts[i], [xj, yj] = pts[j];
    if ((yi > cy) !== (yj > cy) && cx < ((xj - xi) * (cy - yi)) / (yj - yi) + xi) inside = !inside;
    if (distSqToSegment(cx, cy, xi, yi, xj, yj) <= r * r) return true;
  }
  return inside;
}

function hitsColumn(col, cx, cy, r) {
  const w = CONFIG.columnWidth;
  if (cx + r < col.x || cx - r > col.x + w) return false; // quick reject
  return (
    circleHitsPolygon(cx, cy, r, stumpPolygon(col.x, col.gapTop, -1)) ||
    circleHitsPolygon(cx, cy, r, stumpPolygon(col.x, col.gapBottom, 1))
  );
}

/* =====================================================================
   Update (runs at a fixed 120 steps per second)
   ===================================================================== */
function crash() {
  game.state = 'dying';
  game.shake = 0.35;
  game.flash = 1;
  game.player.vy = Math.max(game.player.vy, 60);
  sound.hit();
}

function endRun() {
  game.state = 'over';
  game.overTimer = 0;
  if (game.score > game.best) {
    game.best = game.score;
    game.newBest = true;
    saveValue(STORAGE.best, game.best);
  }
}

// Gravity, capped fall speed, and tilt that follows vertical velocity.
function applyPhysics(dt, tiltDownBias) {
  const p = game.player;
  p.vy = Math.min(p.vy + CONFIG.gravity * dt, CONFIG.maxFallSpeed);
  p.y += p.vy * dt;
  const target = Math.min(
    CONFIG.maxTiltDown,
    Math.max(CONFIG.maxTiltUp, (p.vy / CONFIG.maxFallSpeed) * CONFIG.maxTiltDown + tiltDownBias)
  );
  p.angle += (target - p.angle) * Math.min(1, dt * CONFIG.tiltResponse);
}

function update(dt) {
  const p = game.player;
  const R = CONFIG.playerRadius;
  game.time += dt;
  game.shake = Math.max(0, game.shake - dt);
  game.flash = Math.max(0, game.flash - dt * 3);
  p.flap = Math.max(0, p.flap - dt * 5);
  p.wing += p.wingSpeed * dt;

  switch (game.state) {
    case 'ready': {
      // Hover in place while the world drifts by.
      game.scroll += CONFIG.startSpeed * dt;
      game.campusScroll += CONFIG.startSpeed * CONFIG.campusScrollRatio * dt;
      p.y = CONFIG.readyY + Math.sin(game.time * 3) * 6;
      p.angle = 0;
      p.wingSpeed += (CONFIG.wingBeatSpeed - p.wingSpeed) * Math.min(1, dt * 3);
      break;
    }

    case 'playing': {
      // Difficulty ramps gently with score, up to the configured limits.
      game.speed = Math.min(CONFIG.maxSpeed, CONFIG.startSpeed + game.score * CONFIG.speedPerPoint);
      const dx = game.speed * dt;
      game.scroll += dx;
      // The campus loops on its own, slower; it never affects spawning.
      game.campusScroll += dx * CONFIG.campusScrollRatio;

      for (const col of game.columns) col.x -= dx;
      game.columns = game.columns.filter((col) => col.x > -CONFIG.columnWidth - 10);
      const last = game.columns[game.columns.length - 1];
      // Each pair carries its own random distance to the next one.
      if (!last || last.x + last.next <= W + 10) {
        spawnColumn(last ? last.x + last.next : W + 10, last ? last.next : 0);
      }

      p.wingSpeed += (CONFIG.wingBeatSpeed - p.wingSpeed) * Math.min(1, dt * 3);
      applyPhysics(dt, 0);

      // Score once Clutch's centre passes a column's trailing edge.
      for (const col of game.columns) {
        if (!col.passed && col.x + CONFIG.columnWidth < CONFIG.playerX) {
          col.passed = true;
          game.score++;
          sound.score();
        }
      }

      // Collisions: ground, ceiling, stumps.
      const hr = R - CONFIG.hitboxForgiveness;
      if (p.y + R >= GROUND_Y) {
        p.y = GROUND_Y - R;
        crash();
        endRun();
      } else if (p.y - hr <= 0) {
        p.y = hr;
        p.vy = 0;
        crash();
      } else if (game.columns.some((col) => hitsColumn(col, CONFIG.playerX, p.y, hr))) {
        crash();
      }
      break;
    }

    case 'dying': {
      // World freezes; Clutch drops to the ground nose-first.
      p.wingSpeed += (0 - p.wingSpeed) * Math.min(1, dt * 2);
      applyPhysics(dt, 0.6);
      if (p.y + R >= GROUND_Y) {
        p.y = GROUND_Y - R;
        endRun();
      }
      break;
    }

    case 'over': {
      game.overTimer += dt;
      p.wingSpeed += (0 - p.wingSpeed) * Math.min(1, dt * 2);
      break;
    }
  }
}

/* =====================================================================
   Render
   ===================================================================== */
function drawReadyScreen(c) {
  drawText(c, 'CLUTCH', W / 2, 150, 62);
  drawText(c, 'Fly the Mountain Hawk across campus', W / 2, 202, 18);

  drawPanel(c, 90, 400, W - 180, 130);
  const pulse = 0.6 + 0.4 * Math.sin(game.time * 4);
  c.globalAlpha = pulse;
  drawSmallText(c, 'Tap, click or Space to flap', W / 2, 432, 18, PALETTE.accentLight);
  c.globalAlpha = 1;
  drawSmallText(c, 'M to mute  ·  T for day / night', W / 2, 462, 14);
  drawSmallText(c, `Best: ${game.best}`, W / 2, 498, 20, PALETTE.gold);
}

function drawGameOverScreen(c) {
  // Slide the panel in from above.
  const t = Math.min(1, game.overTimer / 0.35);
  const ease = 1 - Math.pow(1 - t, 3);
  const y0 = -280 + ease * 450;

  c.fillStyle = PALETTE.dim;
  c.globalAlpha = ease;
  c.fillRect(0, 0, W, H);
  c.globalAlpha = 1;
  drawPanel(c, 70, y0, W - 140, 270);
  drawText(c, 'GAME OVER', W / 2, y0 + 48, 40);

  drawSmallText(c, 'SCORE', W / 2 - 80, y0 + 105, 15, PALETTE.accentLight);
  drawSmallText(c, 'BEST', W / 2 + 80, y0 + 105, 15, PALETTE.accentLight);
  drawText(c, game.score, W / 2 - 80, y0 + 145, 44);
  drawText(c, game.best, W / 2 + 80, y0 + 145, 44, PALETTE.gold);

  if (game.newBest) {
    const s = 1 + 0.06 * Math.sin(game.time * 8);
    c.save();
    c.translate(W / 2, y0 + 192);
    c.scale(s, s);
    drawText(c, 'NEW BEST!', 0, 0, 22, PALETTE.accentMid);
    c.restore();
  }

  if (game.overTimer >= CONFIG.restartDelay) {
    c.globalAlpha = 0.6 + 0.4 * Math.sin(game.time * 4);
    drawSmallText(c, 'Tap or Space to retry', W / 2, y0 + 240, 17, PALETTE.accentLight);
    c.globalAlpha = 1;
  }
}

function render(c) {
  const p = game.player;

  c.save();
  if (game.shake > 0) {
    const m = (game.shake / 0.35) * 6;
    c.translate((Math.random() - 0.5) * m, (Math.random() - 0.5) * m);
  }

  drawBackground(c, game.campusScroll);
  for (const col of game.columns) {
    drawStumpPair(c, col);
  }
  drawGround(c, game.scroll);

  const dead = game.state === 'dying' || game.state === 'over';
  const eye = dead ? 'ko' : game.time % 3.2 < 0.12 ? 'blink' : 'open';
  drawPlayer(c, CONFIG.playerX, p.y, p.angle, p.wing, p.flap, eye);
  c.restore();

  if (game.flash > 0) {
    c.fillStyle = `rgba(255, 245, 235, ${game.flash * 0.6})`;
    c.fillRect(0, 0, W, H);
  }

  if (game.state === 'ready') drawReadyScreen(c);
  if (game.state === 'playing' || game.state === 'dying') drawScore(c, game.score, W / 2, 70, 56);
  if (game.state === 'over') drawGameOverScreen(c);

  drawSoundIcon(c, MUTE_BUTTON.x, MUTE_BUTTON.y, sound.muted);
  drawThemeIcon(c, THEME_BUTTON.x, THEME_BUTTON.y, themeName);
}

/* =====================================================================
   Input — mouse, touch and pen via pointer events, plus keyboard.
   ===================================================================== */
const MUTE_BUTTON = { x: W - 36, y: 36, r: 24 };
const THEME_BUTTON = { x: W - 36, y: 86, r: 24 };

function handlePress() {
  sound.init(); // first gesture unlocks audio
  if (game.state === 'ready') startGame();
  else if (game.state === 'playing') flap();
  else if (game.state === 'over' && game.overTimer >= CONFIG.restartDelay) resetGame();
}

// Convert a screen position to logical 480x720 coordinates.
function toLogical(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: ((clientX - rect.left) / rect.width) * W,
    y: ((clientY - rect.top) / rect.height) * H,
  };
}

// Listen on the whole window so taps on the letterbox area also count.
window.addEventListener('pointerdown', (e) => {
  if (e.button > 0) return; // left click / touch only
  e.preventDefault();
  const pt = toLogical(e.clientX, e.clientY);
  if (Math.hypot(pt.x - MUTE_BUTTON.x, pt.y - MUTE_BUTTON.y) <= MUTE_BUTTON.r) {
    sound.init();
    sound.toggleMute();
    return;
  }
  if (Math.hypot(pt.x - THEME_BUTTON.x, pt.y - THEME_BUTTON.y) <= THEME_BUTTON.r) {
    toggleTheme();
    return;
  }
  handlePress();
}, { passive: false });

window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
    e.preventDefault(); // stop the page from scrolling
    if (!e.repeat) handlePress();
  } else if (e.code === 'KeyT' && !e.repeat) {
    toggleTheme();
  } else if (e.code === 'KeyM' && !e.repeat) {
    sound.init();
    sound.toggleMute();
  }
});

// Block the long-press context menu on mobile.
window.addEventListener('contextmenu', (e) => e.preventDefault());

/* =====================================================================
   Main loop — fixed timestep so the game plays identically on 60, 120
   or 144 Hz screens. Rendering happens once per display frame.
   ===================================================================== */
const STEP = 1 / 120;
let accumulator = 0;
let lastTime = performance.now();

function frame(now) {
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (dt > 0.25) dt = 0.25; // avoid a huge catch-up after tab switches
  accumulator += dt;
  while (accumulator >= STEP) {
    update(STEP);
    accumulator -= STEP;
  }
  render(ctx);
  requestAnimationFrame(frame);
}

resetGame();
requestAnimationFrame(frame);
</script>
