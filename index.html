<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Clutch</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #120c24;
    overflow: hidden;
    touch-action: none;           /* no scroll/zoom gestures on mobile */
    -webkit-user-select: none;
    user-select: none;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    image-rendering: auto;
  }
</style>
</head>
<body>
<canvas id="game" aria-label="Clutch game"></canvas>
<script>
'use strict';

/* =====================================================================
   CONFIG — tune the game from here.
   All sizes are in logical pixels on a fixed 480x720 playfield; the
   canvas is scaled to fit the screen, so these never change per device.
   ===================================================================== */
const CONFIG = {
  width: 480,
  height: 720,
  groundHeight: 96,

  // --- Player physics (px, px/s, px/s²) ---
  playerX: 130,           // Clutch's fixed horizontal position
  readyY: 300,            // where Clutch hovers on the start screen
  gravity: 1650,          // downward acceleration
  flapVelocity: -480,     // vertical speed set on each flap (negative = up)
  maxFallSpeed: 650,      // terminal falling speed
  maxTiltUp: -0.45,       // radians, nose-up tilt after a flap
  maxTiltDown: 1.3,       // radians, nose-down tilt when falling fast
  tiltResponse: 10,       // how quickly the tilt follows velocity
  hitboxForgiveness: 3,   // player hitbox is this many px smaller than the art
  wingBeatSpeed: 16,      // wing-beat speed while gliding (radians/s; 2π = one beat)
  flapWingSpeed: 30,      // wing-beat speed right after a flap

  // --- Speed & difficulty ---
  startSpeed: 150,        // world scroll speed at score 0 (px/s)
  maxSpeed: 220,          // speed never goes above this
  speedPerPoint: 2,       // extra speed for each point scored
  startGap: 195,          // vertical opening between peaks at score 0
  minGap: 145,            // the opening never gets smaller than this
  gapPerPoint: 1.5,       // opening shrinks by this much per point
  columnSpacing: 250,     // horizontal distance between column pairs
  gapEdgeMargin: 70,      // min distance from an opening to ceiling/ground
  maxGapShift: 230,       // max change in opening height between neighbours

  // --- Feel ---
  restartDelay: 0.6,      // seconds before the game-over screen accepts input
  volume: 0.6,            // master sound volume (0..1)

  // How fast each background layer moves relative to the ground (0..1).
  parallax: {
    clouds: 0.12,
    farRidge: 0.2,
    midRidge: 0.35,
    nearRidge: 0.55,
    ground: 1,
  },

  // Obstacle look
  columnWidth: 78,
  pixelSize: 3,           // size of one art pixel for the peaks and scenery (logical px)

  // Player look
  playerRadius: 18,
};

/* Colour palette for Clutch and the UI. Scenery and peak colours for the
   day and night themes live in THEMES further down. */
const PALETTE = {
  // UI accents (Lehigh brown and gold)
  accentLight: '#ffe6a8',
  accentMid: '#ffc93a',

  // Clutch the Mountain Hawk: brown and white with a gold beak.
  hawkBody: '#6b3a1a',
  hawkLight: '#9a6337',
  hawkShade: '#43220c',
  hawkWing: '#55301a',
  hawkWingEdge: '#a8743f',
  hawkOutline: '#241108',
  hawkWhite: '#fbf6ec',
  hawkBelly: '#efdcbc',
  hawkStreak: '#8a5530',
  beak: '#f5b82e',
  beakShade: '#d08f16',
  iris: '#ffc93a',
  gold: '#ffd36b',

  text: '#fff1dc',
  textOutline: '#2a1610',
  panel: 'rgba(43, 26, 16, 0.72)',
  panelSolid: 'rgba(43, 26, 16, 0.92)',
  dim: 'rgba(20, 12, 6, 0.35)',
};

const W = CONFIG.width;
const H = CONFIG.height;
const GROUND_Y = H - CONFIG.groundHeight;
const FONT = "'Trebuchet MS', 'Segoe UI', system-ui, sans-serif";

/* =====================================================================
   Canvas setup and responsive scaling
   ===================================================================== */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// Fit the canvas inside the window while keeping the 2:3 aspect ratio,
// and render at device-pixel resolution so it stays crisp on phones.
function resize() {
  const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
  const cssW = Math.floor(W * scale);
  const cssH = Math.floor(H * scale);
  canvas.style.width = cssW + 'px';
  canvas.style.height = cssH + 'px';
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);
  // After this, all drawing uses logical 480x720 coordinates.
  ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
}
window.addEventListener('resize', resize);
resize();

/* =====================================================================
   Small helpers
   ===================================================================== */

// Deterministic PRNG so the scenery looks the same on every load.
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function roundRectPath(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

// Positive modulo, for wrapping scroll offsets.
function wrap(v, m) {
  return ((v % m) + m) % m;
}

/* =====================================================================
   Themes — day (light) and night (dark). All scenery colours live here.
   ===================================================================== */
const THEMES = {
  light: {
    page: '#9fd3f5',                       // page colour around the game
    sky: ['#4a94dc', '#5aa4e6', '#6db4ee', '#84c4f4', '#9dd3f8', '#b9e2fb'], // top → horizon
    sun: '#ffe066', sunCore: '#fff6c2', sunRim: '#f5b82e',
    cloud: '#ffffff', cloudShade: '#d6eaf8', cloudOutline: '#8db6dc', cloudAlpha: 1,
    far: '#8fb7d6', farTop: '#a9cbe4', farSnow: '#eef6fc',
    mid: '#76b884', midTop: '#93cf9c', midOutline: '#4f8f5e',
    near: '#4f9a5a', nearTop: '#6cb86a', nearOutline: '#2c5e36',
    tree: '#2f7a3e', treeDark: '#1f5a2c',
    grass: '#5cb84a', grassLight: '#8fd46a', grassDark: '#3a8a34',
    dirt: '#9a6a44', dirtLight: '#b8875a', dirtDark: '#6e4a2e',
    stone: '#c9b597', stoneDark: '#8f7c64',
    peak: {
      rock: '#9a6f56', rockLight: '#c49a76', rockShade: '#6e4c3c', rockDeep: '#4e3529',
      rockCrack: '#3b2820', snow: '#f7f9fc', snowShade: '#c3cfe2',
      pine: '#4f9a5a', pineDark: '#2c5e36', peakOutline: '#2a1610',
    },
  },
  dark: {
    page: '#05071a',
    sky: ['#04061a', '#070b23', '#0b112d', '#101838', '#152044', '#1b2952'],
    moon: '#eef0dc', moonShade: '#c6c8b0', moonCrater: '#aeb098', moonGlow: '#22305e',
    star: '#fff8e0',
    cloud: '#3d4a78', cloudShade: '#2d3862', cloudOutline: '#1a2142', cloudAlpha: 0.9,
    far: '#18224a', farTop: '#212d5a', farSnow: '#55628e',
    mid: '#173a36', midTop: '#1f4a40', midOutline: '#0c2420',
    near: '#1d4a2c', nearTop: '#285e38', nearOutline: '#0b2414',
    tree: '#163e22', treeDark: '#0c2816',
    grass: '#2f6e34', grassLight: '#46904a', grassDark: '#1c4a20',
    dirt: '#4a3222', dirtLight: '#5e412c', dirtDark: '#2e1e13',
    stone: '#6e6252', stoneDark: '#463c30',
    peak: {
      rock: '#6a5048', rockLight: '#86685a', rockShade: '#4a3632', rockDeep: '#352628',
      rockCrack: '#241a1a', snow: '#c8d2ea', snowShade: '#8e9cc0',
      pine: '#2f6a40', pineDark: '#1a3e26', peakOutline: '#140c0a',
    },
  },
};

// Current theme. A saved choice wins; otherwise follow the device setting.
const THEME_KEY = 'flap-game.theme';
let themeName = (() => {
  try {
    const saved = localStorage.getItem(THEME_KEY);
    if (saved === 'light' || saved === 'dark') return saved;
  } catch (e) { /* storage unavailable */ }
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
})();
const theme = () => THEMES[themeName];

function applyPageColour() {
  document.documentElement.style.background = theme().page;
  document.body.style.background = theme().page;
}

function toggleTheme() {
  themeName = themeName === 'light' ? 'dark' : 'light';
  try { localStorage.setItem(THEME_KEY, themeName); } catch (e) { /* ignore */ }
  applyPageColour();
}
applyPageColour();

/* =====================================================================
   Pixel-art scenery. Every layer is painted once per theme at "art
   resolution" (1 art pixel = CONFIG.pixelSize logical px) onto a small
   offscreen canvas, then drawn scaled up without smoothing — the same
   chunky look as Clutch and the peaks.
   ===================================================================== */
const PX = CONFIG.pixelSize;
const ART_W = W / PX;                         // 160 art px across the screen
const SKY_ROWS = GROUND_Y / PX;               // 208 rows of sky down to the ground
const GROUND_ROWS = CONFIG.groundHeight / PX; // 32 rows of grass and dirt
const BLADE_ROWS = 3;                         // grass blades poke above the ground line
const SCENERY_TILE = 960;                     // hills repeat every 960 logical px
const TILE_ART = SCENERY_TILE / PX;

// Small canvas plus a one-pixel "plot" helper.
function pixelCanvas(w, h) {
  const cv = document.createElement('canvas');
  cv.width = w;
  cv.height = h;
  const g = cv.getContext('2d');
  const plot = (x, y, colour) => { g.fillStyle = colour; g.fillRect(x, y, 1, 1); };
  return { cv, g, plot };
}

// Sky: flat colour bands with a dithered seam between each, plus the sun
// (day) or the moon with a soft dithered glow (night).
function buildSky(T, night) {
  const { cv, g, plot } = pixelCanvas(ART_W, SKY_ROWS);
  const bands = T.sky.length;
  const bandH = Math.ceil(SKY_ROWS / bands);
  for (let y = 0; y < SKY_ROWS; y++) {
    const i = Math.min(bands - 1, Math.floor(y / bandH));
    g.fillStyle = T.sky[i];
    g.fillRect(0, y, ART_W, 1);
    if (i < bands - 1 && y % bandH >= bandH - 3) {
      // Checkerboard of the next band's colour, denser toward it.
      const step = y % bandH === bandH - 1 ? 1 : 2;
      for (let x = (y % 2); x < ART_W; x += step * 2) plot(x, y, T.sky[i + 1]);
    }
  }

  const cx = 112, cy = 40;
  if (!night) {
    const r = 11;
    // Eight short rays.
    for (let k = 0; k < 8; k++) {
      const a = (k * Math.PI) / 4;
      for (let d = r + 3; d <= r + 5; d++) {
        plot(Math.round(cx + Math.cos(a) * d), Math.round(cy + Math.sin(a) * d), T.sun);
      }
    }
    for (let y = -r; y <= r; y++) {
      for (let x = -r; x <= r; x++) {
        const d = Math.hypot(x, y);
        if (d > r + 0.3) continue;
        plot(cx + x, cy + y, d > r - 1.2 ? T.sunRim : d < r * 0.55 ? T.sunCore : T.sun);
      }
    }
  } else {
    const r = 10;
    for (let y = -r - 5; y <= r + 5; y++) {
      for (let x = -r - 5; x <= r + 5; x++) {
        const d = Math.hypot(x, y);
        if (d > r + 0.3 && d < r + 5 && (x + y) % 2 === 0) plot(cx + x, cy + y, T.moonGlow);
      }
    }
    const craters = [[-3, 3, 2.2], [3, -4, 1.6], [4, 4, 1.1], [-5, -3, 1]];
    for (let y = -r; y <= r; y++) {
      for (let x = -r; x <= r; x++) {
        if (Math.hypot(x, y) > r + 0.3) continue;
        let col = T.moon;
        if (Math.hypot(x + 3, y + 2) > r) col = T.moonShade;       // shaded lower-right rim
        for (const [kx, ky, kr] of craters) if (Math.hypot(x - kx, y - ky) <= kr) col = T.moonCrater;
        plot(cx + x, cy + y, col);
      }
    }
  }
  return cv;
}

// Twinkling night stars, on the pixel grid (drawn live, not pre-rendered).
const starRand = mulberry32(4242);
const STARS = Array.from({ length: 55 }, () => ({
  x: Math.floor(starRand() * ART_W),
  y: Math.floor(starRand() * 120),
  big: starRand() < 0.18,
  phase: starRand() * Math.PI * 2,
  speed: 1 + starRand() * 2.5,
}));

function drawStars(c, time) {
  c.fillStyle = theme().star;
  for (const s of STARS) {
    if (Math.hypot(s.x - 112, s.y - 40) < 17) continue; // keep clear of the moon
    c.globalAlpha = (0.45 + 0.55 * Math.sin(time * s.speed + s.phase)) * (1 - s.y / 150);
    c.fillRect(s.x * PX, s.y * PX, PX, PX);
    if (s.big) {
      c.globalAlpha *= 0.6;
      c.fillRect((s.x - 1) * PX, s.y * PX, PX, PX);
      c.fillRect((s.x + 1) * PX, s.y * PX, PX, PX);
      c.fillRect(s.x * PX, (s.y - 1) * PX, PX, PX);
      c.fillRect(s.x * PX, (s.y + 1) * PX, PX, PX);
    }
  }
  c.globalAlpha = 1;
}

// Puffy pixel cloud with a flat base, shaded underside and outline.
function buildCloud(T, s) {
  const puffs = [[0, 0, 7], [8, -3, 9], [17, -1, 7], [24, 2, 5], [-7, 2, 5]]
    .map(([x, y, r]) => [x * s, y * s, r * s]);
  const minX = Math.floor(-12 * s) - 1, maxX = Math.ceil(30 * s) + 1;
  const minY = Math.floor(-12 * s) - 1, base = Math.round(5 * s);
  const w = maxX - minX + 1, h = base - minY + 1;
  const inside = (x, y) => y <= base && puffs.some(([px, py, r]) => Math.hypot(x - px, y - py) <= r);
  const { cv, plot } = pixelCanvas(w, h);
  for (let y = minY; y <= base; y++) {
    for (let x = minX; x <= maxX; x++) {
      if (!inside(x, y)) continue;
      const edge = !inside(x - 1, y) || !inside(x + 1, y) || !inside(x, y - 1) || !inside(x, y + 1);
      plot(x - minX, y - minY, edge ? T.cloudOutline : y >= base - 2 ? T.cloudShade : T.cloud);
    }
  }
  return cv;
}

const cloudRand = mulberry32(777);
const CLOUDS = Array.from({ length: 6 }, (_, i) => ({
  x: (i / 6) * SCENERY_TILE + cloudRand() * 80,
  y: 70 + cloudRand() * 230,
  v: i % 3, // which cloud shape (size) to use
}));

// Height (logical y) of a ridge at logical x, from its sampled points.
const RIDGE_STEP = 8;
function makeRidge(baseY, waves, peaky) {
  const pts = [];
  for (let x = 0; x <= SCENERY_TILE; x += RIDGE_STEP) {
    let h = 0;
    for (const [freq, amp, phase] of waves) {
      const a = (Math.PI * freq * x) / SCENERY_TILE + phase;
      // "peaky" gives sharp mountain tops, otherwise rolling hills.
      h += peaky ? amp * (1 - Math.abs(Math.sin(a))) : amp * Math.sin(a * 2);
    }
    pts.push(baseY - h);
  }
  return pts;
}
function ridgeAt(pts, x) {
  const tx = wrap(x, SCENERY_TILE);
  const i = Math.floor(tx / RIDGE_STEP);
  const t = (tx - i * RIDGE_STEP) / RIDGE_STEP;
  return pts[i] + (pts[i + 1] - pts[i]) * t;
}
const FAR_RIDGE = makeRidge(520, [[3, 70, 0.4], [7, 30, 1.1], [17, 10, 0.2]], true);
const MID_RIDGE = makeRidge(575, [[2, 26, 0.9], [5, 14, 2.0], [11, 5, 0.5]], false);
const NEAR_RIDGE = makeRidge(612, [[3, 18, 2.4], [7, 8, 0.3]], false);

// One ridge layer as a strip wide enough to scroll seamlessly (one tile
// plus a screen). opts: fill / top / outline colours, snowy peaks, trees.
function buildRidge(pts, opts) {
  const width = TILE_ART + ART_W;
  const { cv, g, plot } = pixelCanvas(width, SKY_ROWS);
  const tops = [];
  for (let ax = 0; ax < width; ax++) tops.push(Math.round(ridgeAt(pts, ax * PX + PX / 2) / PX));
  const highest = Math.min(...tops);
  const rnd = mulberry32(opts.seed);
  for (let ax = 0; ax < width; ax++) {
    const ty = tops[ax];
    g.fillStyle = opts.fill;
    g.fillRect(ax, ty, 1, SKY_ROWS - ty);
    plot(ax, ty + 1, opts.top);
    if (opts.snow && ty < highest + 9) {
      for (let k = 0; k < 3; k++) plot(ax, ty + k, opts.snow);
    }
    plot(ax, ty, opts.outline || opts.top);
  }
  // Round pixel trees along the ridge line (kept off the strip ends so
  // the pattern repeats cleanly).
  if (opts.trees) {
    for (let ax = 4; ax < TILE_ART - 4; ax += 5 + Math.floor(rnd() * 9)) {
      const ty = Math.max(tops[ax - 1], tops[ax], tops[ax + 1]);
      for (const copy of [0, TILE_ART]) {
        if (ax + copy + 1 >= width) continue;
        const x = ax + copy;
        plot(x, ty - 3, opts.outline);
        plot(x - 1, ty - 2, opts.outline); plot(x, ty - 2, opts.trees[0]); plot(x + 1, ty - 2, opts.outline);
        plot(x - 1, ty - 1, opts.outline); plot(x, ty - 1, opts.trees[1]); plot(x + 1, ty - 1, opts.outline);
        plot(x, ty, opts.outline);
      }
    }
  }
  return cv;
}

// Ground strip: grass blades and turf on top, layered dirt with pebbles
// below. Painted as one repeating tile, then copied across a strip.
const GROUND_TILE = 32; // art px
function buildGround(T) {
  const rnd = mulberry32(99);
  const rows = GROUND_ROWS + BLADE_ROWS;
  const tile = pixelCanvas(GROUND_TILE, rows);
  const { g, plot } = tile;
  for (let x = 0; x < GROUND_TILE; x++) {
    const blade = Math.floor(rnd() * 3);                    // 0..2 px tall
    const hang = rnd() < 0.3 ? 1 : rnd() < 0.15 ? 2 : 0;     // turf hanging into dirt
    const turfEnd = BLADE_ROWS + 5 + hang;
    // Dirt, darkening with depth.
    for (let y = turfEnd; y < rows; y++) {
      let col = T.dirt;
      if (y > rows - 6 || (y > rows - 12 && (x + y) % 2 === 0)) col = T.dirtDark;
      plot(x, y, col);
    }
    // Turf with a dark top edge and dark lower lip.
    const top = BLADE_ROWS - blade;
    for (let y = top; y < turfEnd; y++) plot(x, y, T.grass);
    plot(x, top, T.grassDark);
    plot(x, top + 1, T.grassLight);
    plot(x, turfEnd - 1, T.grassDark);
  }
  // Light specks and small stones in the dirt.
  for (let i = 0; i < 16; i++) {
    plot(Math.floor(rnd() * GROUND_TILE), BLADE_ROWS + 9 + Math.floor(rnd() * 16), T.dirtLight);
  }
  for (let i = 0; i < 3; i++) {
    const sx = 1 + Math.floor(rnd() * (GROUND_TILE - 4));
    const sy = BLADE_ROWS + 11 + Math.floor(rnd() * 12);
    g.fillStyle = T.stone;
    g.fillRect(sx, sy, 3, 2);
    plot(sx + 2, sy + 1, T.stoneDark);
    plot(sx, sy + 2, T.stoneDark); plot(sx + 1, sy + 2, T.stoneDark); plot(sx + 2, sy + 2, T.stoneDark);
  }
  // Copy the tile across a strip one screen + one tile wide.
  const width = ART_W + GROUND_TILE;
  const strip = pixelCanvas(width, rows);
  for (let x = 0; x < width; x += GROUND_TILE) strip.g.drawImage(tile.cv, x, 0);
  return strip.cv;
}

// Pre-render every layer for both themes.
function buildScenery(T, night) {
  return {
    sky: buildSky(T, night),
    clouds: [0.8, 1, 1.25].map((s) => buildCloud(T, s)),
    far: buildRidge(FAR_RIDGE, { fill: T.far, top: T.farTop, snow: T.farSnow, seed: 1 }),
    mid: buildRidge(MID_RIDGE, { fill: T.mid, top: T.midTop, outline: T.midOutline, seed: 2 }),
    near: buildRidge(NEAR_RIDGE, {
      fill: T.near, top: T.nearTop, outline: T.nearOutline, trees: [T.tree, T.treeDark], seed: 3,
    }),
    ground: buildGround(T),
  };
}
const SCENERY = { light: buildScenery(THEMES.light, false), dark: buildScenery(THEMES.dark, true) };

/* =====================================================================
   Draw functions — background layers and ground
   ===================================================================== */

// Draws a pre-rendered pixel canvas at logical position, scaled by PX.
function blit(c, img, x, y) {
  c.drawImage(img, x, y, img.width * PX, img.height * PX);
}

function drawRidgeLayer(c, img, scroll, factor) {
  blit(c, img, -wrap(scroll * factor, SCENERY_TILE), 0);
}

function drawBackground(c, time, scroll) {
  const S = SCENERY[themeName];
  c.save();
  c.imageSmoothingEnabled = false;
  blit(c, S.sky, 0, 0);
  if (themeName === 'dark') drawStars(c, time);

  const cloudOff = wrap(scroll * CONFIG.parallax.clouds, SCENERY_TILE);
  c.globalAlpha = theme().cloudAlpha;
  for (const cl of CLOUDS) {
    const img = S.clouds[cl.v];
    const x = wrap(cl.x - cloudOff, SCENERY_TILE) - 100;
    blit(c, img, x, cl.y);
    if (x + img.width * PX > SCENERY_TILE - 100) blit(c, img, x - SCENERY_TILE, cl.y);
  }
  c.globalAlpha = 1;

  drawRidgeLayer(c, S.far, scroll, CONFIG.parallax.farRidge);
  drawRidgeLayer(c, S.mid, scroll, CONFIG.parallax.midRidge);
  drawRidgeLayer(c, S.near, scroll, CONFIG.parallax.nearRidge);
  c.restore();
}

function drawGround(c, scroll) {
  c.save();
  c.imageSmoothingEnabled = false;
  blit(c, SCENERY[themeName].ground, -wrap(scroll, GROUND_TILE * PX), GROUND_Y - BLADE_ROWS * PX);
  c.restore();
}

/* =====================================================================
   Draw functions — mountain peak obstacles (pixel art)
   Each peak is painted once, pixel by pixel, onto a tiny offscreen canvas
   when its column spawns, then scaled up without smoothing so it keeps
   the same chunky pixel look as Clutch's sprite.
   ===================================================================== */

// Pine tree stamp: G = pine, D = dark pine, T = trunk, . = empty.
const PINE = ['..G..', '.GGD.', 'GGGDD', '.GGD.', 'GGGDD', '..T..'];

/**
 * Builds one mountain peak. Row 0 is the summit; rows grow toward the
 * root (the ground for bottom peaks, the ceiling for top peaks).
 * Returns the canvas plus the shape numbers the hitbox needs.
 */
function makePeak(seed, rows) {
  const rnd = mulberry32(seed);
  const WP = Math.round(CONFIG.columnWidth / CONFIG.pixelSize); // width in art pixels
  const apex = Math.round(WP / 2 + (rnd() * 2 - 1) * 3);  // summit column, a bit off-centre
  const tpl = 22 + Math.floor(rnd() * 10);  // rows until the left slope reaches full width
  const tpr = 22 + Math.floor(rnd() * 10);  // same for the right slope

  // Silhouette edges for each row (right edge is exclusive).
  const left = (y) => (y >= tpl ? 0 : Math.round((apex - 1) * (1 - y / tpl)));
  const right = (y) => (y >= tpr ? WP : Math.round(apex + 1 + (WP - apex - 1) * (y / tpr)));
  // Occasional rocky ledges: short runs where the edge steps inward by one
  // pixel (never outward, so the hitbox is never bigger than the art).
  const ledges = (arr) => {
    for (let y = 0; y < rows; y++) arr.push(0);
    for (let y = 4; y < rows; y++) {
      if (rnd() < 0.06) {
        const len = 3 + Math.floor(rnd() * 4);
        for (let k = y; k < Math.min(rows, y + len); k++) arr[k] = 1;
        y += len + 2;
      }
    }
    return arr;
  };
  const notchL = ledges([]), notchR = ledges([]);
  const inside = (x, y) =>
    y >= 0 && y < rows && x >= left(y) + notchL[y] && x < right(y) - notchR[y];

  // Jagged snow cap, deeper near the summit, with a few drips.
  const snowLine = [];
  for (let x = 0; x < WP; x++) {
    const nearApex = Math.abs(x - apex) < 5 ? 3 : 0;
    snowLine.push(11 + Math.floor(rnd() * 3) + nearApex + (rnd() < 0.18 ? 3 : 0));
  }
  // Light comes from the upper left: the shade boundary is a ridge that
  // runs from the summit down and to the right.
  const ridge = (y) => apex + Math.floor(y * 0.25);

  // Rock strata: short dark cracks at irregular intervals.
  const cracks = new Set();
  for (let y = 12 + Math.floor(rnd() * 4); y < rows; y += 8 + Math.floor(rnd() * 6)) {
    const len = 3 + Math.floor(rnd() * 6);
    const start = Math.floor(rnd() * (WP - len));
    for (let x = start; x < start + len; x++) cracks.add(y * WP + x);
  }

  // 1) Base colours: lit left face, shaded right face, snow cap.
  const grid = [];
  for (let y = 0; y < rows; y++) {
    const row = [];
    for (let x = 0; x < WP; x++) {
      if (!inside(x, y)) { row.push(null); continue; }
      const r = ridge(y);
      const shaded = x > r || (x === r && (x + y) % 2 === 0); // dithered ridge line
      if (y < snowLine[x]) {
        row.push(shaded ? 'snowShade' : 'snow');
      } else if (cracks.has(y * WP + x)) {
        row.push('rockCrack');
      } else if (x <= left(y) + notchL[y] + 1) {
        row.push('rockLight');
      } else if (x >= right(y) - notchR[y] - 2) {
        row.push('rockDeep');
      } else {
        row.push(shaded ? 'rockShade' : 'rock');
      }
    }
    grid.push(row);
  }

  // 2) A few pine trees on the slopes below the snow.
  const snowMax = Math.max(...snowLine);
  const treeTop = snowMax + 3;
  const treeBottom = Math.min(rows - 8, Math.max(tpl, tpr) + 18);
  const fits = (px, py) => {
    for (let dy = -1; dy <= PINE.length; dy++) {
      for (let dx = -1; dx <= 5; dx++) if (!inside(px + dx, py + dy)) return false;
    }
    return true;
  };
  const pines = 3 + Math.floor(rnd() * 3);
  for (let i = 0; i < pines && treeBottom > treeTop; i++) {
    const py = treeTop + Math.floor(rnd() * (treeBottom - treeTop));
    const px = Math.floor(rnd() * (WP - 5));
    if (!fits(px, py)) continue; // only whole trees, clear of the outline
    for (let dy = 0; dy < PINE.length; dy++) {
      for (let dx = 0; dx < 5; dx++) {
        const ch = PINE[dy][dx];
        if (ch === '.') continue;
        grid[py + dy][px + dx] = ch === 'G' ? 'pine' : ch === 'D' ? 'pineDark' : 'rockCrack';
      }
    }
  }

  // 3) Dark outline wherever a pixel borders empty space (except the root).
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < WP; x++) {
      if (!grid[y][x]) continue;
      if (!inside(x - 1, y) || !inside(x + 1, y) || !inside(x, y - 1)) grid[y][x] = 'peakOutline';
    }
  }

  // Paint the grid (which holds colour names) once per theme onto tiny
  // canvases, merging horizontal runs of the same colour.
  const paint = (colours) => {
    const cv = document.createElement('canvas');
    cv.width = WP;
    cv.height = rows;
    const g = cv.getContext('2d');
    for (let y = 0; y < rows; y++) {
      let x = 0;
      while (x < WP) {
        const key = grid[y][x];
        let end = x + 1;
        while (end < WP && grid[y][end] === key) end++;
        if (key) { g.fillStyle = colours[key]; g.fillRect(x, y, end - x, 1); }
        x = end;
      }
    }
    return cv;
  };
  const canvases = { light: paint(THEMES.light.peak), dark: paint(THEMES.dark.peak) };
  return { canvases, apex, tpl, tpr, rows, WP };
}

// Draws one peak with its summit at tipY. dir = 1 grows downward (bottom
// peak, summit on top); dir = -1 grows upward (top peak, hanging summit).
function drawPeak(c, x, tipY, peak, dir) {
  const P = CONFIG.pixelSize;
  c.save();
  c.imageSmoothingEnabled = false;
  c.translate(x, tipY);
  c.scale(1, dir);
  c.drawImage(peak.canvases[themeName], 0, 0, peak.WP * P, peak.rows * P);
  c.restore();
}

// A full obstacle: one peak hanging from the top, one rising from the
// ground. gapTop/gapBottom are the summit positions.
function drawColumnPair(c, col) {
  drawPeak(c, col.x, col.gapTop, col.top, -1);
  drawPeak(c, col.x, col.gapBottom, col.bottom, 1);
}

/* =====================================================================
   Draw functions — the player: "Clutch", a Mountain Hawk
   ===================================================================== */

// One wing in local space: pivot at (0,0), feathers pointing back (-x).
// Positive rotation lifts the wing tip.
function drawWing(c, px, py, rot, fill, edge) {
  c.save();
  c.translate(px, py);
  c.rotate(rot);
  c.beginPath();
  c.moveTo(3, -4);
  c.quadraticCurveTo(-10, -13, -25, -7);   // leading edge to wing tip
  c.lineTo(-19, -3);                        // feather notches
  c.lineTo(-24, 0);
  c.lineTo(-17, 1.5);
  c.lineTo(-21, 5);
  c.quadraticCurveTo(-8, 7, 3, 4);          // trailing edge back to body
  c.closePath();
  c.fillStyle = fill;
  c.fill();
  c.strokeStyle = PALETTE.hawkOutline;
  c.lineWidth = 2;
  c.stroke();
  // Lighter covert feathers along the leading edge.
  c.strokeStyle = edge;
  c.lineWidth = 2.5;
  c.beginPath();
  c.moveTo(0, -3.5);
  c.quadraticCurveTo(-9, -9.5, -18, -6.5);
  c.stroke();
  c.restore();
}

// Fanned tail feathers with pale tips.
function drawTail(c, flap) {
  const R = CONFIG.playerRadius;
  c.save();
  c.translate(-R + 5, 3);
  c.rotate(-0.15 - flap * 0.3);
  for (const a of [-0.35, 0, 0.35]) {
    c.save();
    c.rotate(a);
    c.beginPath();
    c.moveTo(0, -3.5);
    c.lineTo(-15, -4.5);
    c.quadraticCurveTo(-19, 0, -15, 4.5);
    c.lineTo(0, 3.5);
    c.closePath();
    c.fillStyle = PALETTE.hawkShade;
    c.fill();
    c.strokeStyle = PALETTE.hawkOutline;
    c.lineWidth = 1.6;
    c.stroke();
    c.fillStyle = PALETTE.hawkWhite;
    c.fillRect(-16, -3, 3, 6);
    c.restore();
  }
  c.restore();
}

/**
 * @param x,y      centre of the hawk
 * @param angle    body tilt in radians (+ = nose down)
 * @param wing     wing-beat phase in radians
 * @param flap     0..1 amount right after a flap (wings slam down)
 * @param eye      'open' | 'blink' | 'ko' (knocked out after a crash)
 */
function drawVectorHawk(c, x, y, angle, wing, flap, eye) {
  const R = CONFIG.playerRadius;
  // Steady wing beat, plus a hard downstroke right after each flap.
  const wingRot = 0.25 + Math.sin(wing) * 0.45 - flap * 1.1;

  c.save();
  c.translate(x, y);
  c.rotate(angle);
  c.scale(1 + flap * 0.08, 1 - flap * 0.08);

  drawTail(c, flap);
  // Far wing peeks out behind the body.
  drawWing(c, -1, -5, wingRot + 0.25, PALETTE.hawkShade, PALETTE.hawkWing);

  // Talons tucked under the body.
  c.fillStyle = PALETTE.beak;
  c.strokeStyle = PALETTE.hawkOutline;
  c.lineWidth = 1.5;
  for (const fx of [0, 7]) {
    c.beginPath();
    c.ellipse(fx, R - 1, 3.2, 4, 0, 0, Math.PI * 2);
    c.fill();
    c.stroke();
  }

  // Crest feathers ruffled at the back of the head.
  c.fillStyle = PALETTE.hawkBody;
  for (const [cx, h] of [[-6, 7], [0, 9], [6, 6]]) {
    c.beginPath();
    c.moveTo(cx - 4, -R + 4);
    c.lineTo(cx - 6, -R - h + 4);
    c.lineTo(cx + 4, -R + 3);
    c.closePath();
    c.fill();
    c.stroke();
  }

  // Body.
  const g = c.createRadialGradient(-5, -8, 2, 0, 0, R + 2);
  g.addColorStop(0, PALETTE.hawkLight);
  g.addColorStop(0.55, PALETTE.hawkBody);
  g.addColorStop(1, PALETTE.hawkShade);
  c.fillStyle = g;
  c.beginPath();
  c.ellipse(0, 0, R + 1, R - 1, 0, 0, Math.PI * 2);
  c.fill();

  // White head and pale streaked chest (clipped to the body).
  c.save();
  c.beginPath();
  c.ellipse(0, 0, R + 1, R - 1, 0, 0, Math.PI * 2);
  c.clip();
  c.fillStyle = PALETTE.hawkBelly;
  c.beginPath();
  c.ellipse(6, 11, 13, 9, -0.3, 0, Math.PI * 2);
  c.fill();
  c.strokeStyle = PALETTE.hawkStreak;
  c.lineWidth = 1.4;
  for (const [sx, sy] of [[2, 10], [8, 8], [6, 14], [12, 12]]) {
    c.beginPath();
    c.moveTo(sx - 2, sy - 1.5);
    c.lineTo(sx, sy);
    c.lineTo(sx + 2, sy - 1.5);
    c.stroke();
  }
  c.fillStyle = PALETTE.hawkWhite;
  c.beginPath();
  c.ellipse(8, -7, 12, 9.5, 0.15, 0, Math.PI * 2);
  c.fill();
  c.restore();

  c.strokeStyle = PALETTE.hawkOutline;
  c.lineWidth = 2;
  c.beginPath();
  c.ellipse(0, 0, R + 1, R - 1, 0, 0, Math.PI * 2);
  c.stroke();

  // Hooked beak: upper bill, then the shorter lower bill.
  c.lineWidth = 1.6;
  c.fillStyle = PALETTE.beakShade;
  c.beginPath();
  c.moveTo(14, -1.5);
  c.lineTo(21, -1);
  c.lineTo(15, 2.5);
  c.closePath();
  c.fill();
  c.stroke();
  c.fillStyle = PALETTE.beak;
  c.beginPath();
  c.moveTo(13, -7.5);
  c.lineTo(21, -7);
  c.quadraticCurveTo(26.5, -5.5, 25, 0.5);   // hook tip
  c.lineTo(22, -1.8);
  c.lineTo(14, -1.5);
  c.closePath();
  c.fill();
  c.stroke();
  c.fillStyle = PALETTE.hawkOutline;
  c.beginPath();
  c.arc(17.5, -5, 0.9, 0, Math.PI * 2);
  c.fill();

  // Eye with a fierce brow.
  const ex = 10, ey = -7;
  if (eye === 'blink') {
    c.strokeStyle = PALETTE.hawkOutline;
    c.lineWidth = 2;
    c.beginPath();
    c.moveTo(ex - 3.5, ey);
    c.lineTo(ex + 3.5, ey);
    c.stroke();
  } else if (eye === 'ko') {
    c.strokeStyle = PALETTE.hawkOutline;
    c.lineWidth = 2;
    c.lineCap = 'round';
    c.beginPath();
    c.moveTo(ex - 3, ey - 3); c.lineTo(ex + 3, ey + 3);
    c.moveTo(ex + 3, ey - 3); c.lineTo(ex - 3, ey + 3);
    c.stroke();
    c.lineCap = 'butt';
  } else {
    c.fillStyle = PALETTE.iris;
    c.beginPath();
    c.arc(ex, ey, 3.6, 0, Math.PI * 2);
    c.fill();
    c.strokeStyle = PALETTE.hawkOutline;
    c.lineWidth = 1.2;
    c.stroke();
    c.fillStyle = PALETTE.hawkOutline;
    c.beginPath();
    c.arc(ex + 0.8, ey, 1.9, 0, Math.PI * 2);
    c.fill();
    c.fillStyle = '#ffffff';
    c.beginPath();
    c.arc(ex + 1.6, ey - 1.2, 0.8, 0, Math.PI * 2);
    c.fill();
  }
  if (eye !== 'ko') {
    // Brow slants down toward the beak for a determined look.
    c.strokeStyle = PALETTE.hawkShade;
    c.lineWidth = 3;
    c.lineCap = 'round';
    c.beginPath();
    c.moveTo(ex - 5, ey - 6);
    c.lineTo(ex + 5, ey - 3);
    c.stroke();
    c.lineCap = 'butt';
  }

  // Near wing on top.
  drawWing(c, -3, 0, wingRot, PALETTE.hawkWing, PALETTE.hawkWingEdge);

  c.restore();
}

/* =====================================================================
   Clutch sprite (image frames). Falls back to the drawn hawk above if
   the images are missing or haven't loaded yet.
   ===================================================================== */
const SPRITE = {
  // Wing-beat cycle, in order: up, level, down, level (frame 2 is reused).
  frames: ['sprites/clutch-1.png', 'sprites/clutch-2.png', 'sprites/clutch-3.png', 'sprites/clutch-2.png'],
  koFrame: null,     // optional image shown after a crash, e.g. 'sprites/clutch-ko.png'
  width: 72,         // drawn width in logical px; height keeps the image's aspect ratio
  // The point in the image (0..1 across, 0..1 down) that sits on the hitbox centre.
  anchorX: 0.63,
  anchorY: 0.57,
};

function loadImage(src) {
  const img = new Image();
  img.src = src;
  return img;
}
const spriteFrames = SPRITE.frames.map(loadImage);
const spriteKo = SPRITE.koFrame ? loadImage(SPRITE.koFrame) : null;

function imageReady(img) {
  return img && img.complete && img.naturalWidth > 0;
}

/**
 * Draws Clutch. Same parameters as drawVectorHawk. The wing phase picks
 * the animation frame; tilt and flap squash are applied in code.
 */
function drawPlayer(c, x, y, angle, wing, flap, eye) {
  if (!spriteFrames.length || !spriteFrames.every(imageReady)) {
    drawVectorHawk(c, x, y, angle, wing, flap, eye);
    return;
  }
  let img;
  if (eye === 'ko' && imageReady(spriteKo)) {
    img = spriteKo;
  } else {
    const cycle = wrap(wing, Math.PI * 2) / (Math.PI * 2); // 0..1 through a wing beat
    img = spriteFrames[Math.floor(cycle * spriteFrames.length) % spriteFrames.length];
  }
  const w = SPRITE.width;
  const h = (w * img.naturalHeight) / img.naturalWidth;

  c.save();
  c.translate(x, y);
  c.rotate(angle);
  c.scale(1 + flap * 0.08, 1 - flap * 0.08);
  c.drawImage(img, -w * SPRITE.anchorX, -h * SPRITE.anchorY, w, h);
  c.restore();
}

/* =====================================================================
   Draw functions — HUD
   ===================================================================== */
// Outlined, centred text used for the score and panel headings.
function drawText(c, text, x, y, size, color = PALETTE.text) {
  c.font = `bold ${size}px ${FONT}`;
  c.textAlign = 'center';
  c.textBaseline = 'middle';
  c.lineJoin = 'round';
  c.lineWidth = Math.max(3, size * 0.16);
  c.strokeStyle = PALETTE.textOutline;
  c.strokeText(String(text), x, y);
  c.fillStyle = color;
  c.fillText(String(text), x, y);
}

function drawScore(c, value, x, y, size) {
  drawText(c, value, x, y, size);
}

// Plain (un-outlined) small text for use inside panels.
function drawSmallText(c, text, x, y, size, color = PALETTE.text) {
  c.font = `bold ${size}px ${FONT}`;
  c.textAlign = 'center';
  c.textBaseline = 'middle';
  c.fillStyle = color;
  c.fillText(text, x, y);
}

function drawPanel(c, x, y, w, h) {
  c.fillStyle = PALETTE.panelSolid;
  roundRectPath(c, x, y, w, h, 18);
  c.fill();
  c.strokeStyle = PALETTE.accentMid;
  c.lineWidth = 2;
  c.stroke();
}

function drawSoundIcon(c, x, y, muted) {
  c.fillStyle = PALETTE.panel;
  c.beginPath();
  c.arc(x, y, 20, 0, Math.PI * 2);
  c.fill();
  c.fillStyle = PALETTE.text;
  c.beginPath();
  c.moveTo(x - 10, y - 4);
  c.lineTo(x - 5, y - 4);
  c.lineTo(x + 1, y - 10);
  c.lineTo(x + 1, y + 10);
  c.lineTo(x - 5, y + 4);
  c.lineTo(x - 10, y + 4);
  c.closePath();
  c.fill();
  c.strokeStyle = PALETTE.text;
  c.lineWidth = 2;
  c.lineCap = 'round';
  c.beginPath();
  if (muted) {
    c.moveTo(x + 5, y - 5); c.lineTo(x + 12, y + 5);
    c.moveTo(x + 12, y - 5); c.lineTo(x + 5, y + 5);
  } else {
    c.arc(x + 2, y, 6, -0.9, 0.9);
    c.moveTo(x + 2 + 11 * Math.cos(-0.9), y + 11 * Math.sin(-0.9));
    c.arc(x + 2, y, 11, -0.9, 0.9);
  }
  c.stroke();
  c.lineCap = 'butt';
}

// Day/night button. Shows a moon in day mode (tap for night) and a sun
// at night (tap for day).
function drawThemeIcon(c, x, y, name) {
  c.fillStyle = PALETTE.panel;
  c.beginPath();
  c.arc(x, y, 20, 0, Math.PI * 2);
  c.fill();
  c.fillStyle = PALETTE.text;
  if (name === 'light') {
    // Crescent moon: a disc with an offset disc cut out of it.
    c.save();
    c.beginPath();
    c.arc(x, y, 9, 0, Math.PI * 2);
    c.clip();
    c.beginPath();
    c.rect(x - 10, y - 10, 20, 20);
    c.arc(x + 5, y - 4, 8, 0, Math.PI * 2);
    c.fill('evenodd');
    c.restore();
  } else {
    c.beginPath();
    c.arc(x, y, 5.5, 0, Math.PI * 2);
    c.fill();
    c.strokeStyle = PALETTE.text;
    c.lineWidth = 2;
    c.lineCap = 'round';
    c.beginPath();
    for (let k = 0; k < 8; k++) {
      const a = (k * Math.PI) / 4;
      c.moveTo(x + Math.cos(a) * 9, y + Math.sin(a) * 9);
      c.lineTo(x + Math.cos(a) * 12, y + Math.sin(a) * 12);
    }
    c.stroke();
    c.lineCap = 'butt';
  }
}

function drawLabel(c, text, x, y) {
  c.font = `bold 13px ${FONT}`;
  c.textAlign = 'center';
  c.textBaseline = 'middle';
  const w = c.measureText(text).width + 16;
  c.fillStyle = PALETTE.panel;
  roundRectPath(c, x - w / 2, y - 11, w, 22, 11);
  c.fill();
  c.fillStyle = PALETTE.text;
  c.fillText(text, x, y + 1);
}


/* =====================================================================
   Persistence (high score + mute) — localStorage can throw in private
   mode, so every access is guarded.
   ===================================================================== */
const STORAGE = { best: 'flap-game.best', muted: 'flap-game.muted' };

function loadNumber(key) {
  try { return Number(localStorage.getItem(key)) || 0; } catch (e) { return 0; }
}
function saveValue(key, value) {
  try { localStorage.setItem(key, String(value)); } catch (e) { /* ignore */ }
}

/* =====================================================================
   Sound — tiny synthesized effects with the Web Audio API.
   The AudioContext is created on the first input (browser autoplay rules).
   ===================================================================== */
const sound = {
  ctx: null,
  master: null,
  muted: loadNumber(STORAGE.muted) === 1,

  init() {
    if (this.ctx) {
      if (this.ctx.state === 'suspended') this.ctx.resume();
      return;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = this.muted ? 0 : CONFIG.volume;
    this.master.connect(this.ctx.destination);
  },

  toggleMute() {
    this.muted = !this.muted;
    saveValue(STORAGE.muted, this.muted ? 1 : 0);
    if (this.master) {
      this.master.gain.setValueAtTime(this.muted ? 0 : CONFIG.volume, this.ctx.currentTime);
    }
  },

  ready() {
    return this.ctx && !this.muted;
  },

  // One oscillator note with a pitch sweep and a quick fade-out.
  tone(type, f0, f1, dur, vol, delay = 0) {
    const t = this.ctx.currentTime + delay;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(f0, t);
    osc.frequency.exponentialRampToValueAtTime(f1, t + dur);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(this.master);
    osc.start(t);
    osc.stop(t + dur + 0.02);
  },

  // Low-passed white-noise burst (used for the crash).
  noise(dur, vol) {
    const t = this.ctx.currentTime;
    const len = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    const filter = this.ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 1100;
    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(filter).connect(gain).connect(this.master);
    src.start(t);
  },

  flap() {
    if (!this.ready()) return;
    this.tone('triangle', 420, 780, 0.09, 0.25);
  },
  score() {
    if (!this.ready()) return;
    this.tone('sine', 880, 880, 0.09, 0.18);
    this.tone('sine', 1320, 1320, 0.16, 0.18, 0.08);
  },
  hit() {
    if (!this.ready()) return;
    this.noise(0.28, 0.5);
    this.tone('square', 220, 50, 0.32, 0.15);
  },
};

/* =====================================================================
   Game state
   ===================================================================== */
// States: 'ready' (start screen) → 'playing' → 'dying' (falling after a
// crash) → 'over' (game-over screen) → back to 'ready'.
const game = {
  state: 'ready',
  time: 0,
  scroll: 0,          // total distance scrolled, drives every layer
  speed: CONFIG.startSpeed,
  score: 0,
  best: loadNumber(STORAGE.best),
  newBest: false,
  columns: [],
  lastGapCenter: GROUND_Y / 2,
  overTimer: 0,       // time spent on the game-over screen
  shake: 0,           // screen-shake timer after a crash
  flash: 0,           // white flash after a crash
  player: null,
};

function resetGame() {
  game.state = 'ready';
  game.speed = CONFIG.startSpeed;
  game.score = 0;
  game.newBest = false;
  game.columns = [];
  game.lastGapCenter = GROUND_Y / 2;
  game.overTimer = 0;
  game.player = {
    y: CONFIG.readyY,
    vy: 0,
    angle: 0,
    wing: 0,          // wing-beat phase
    wingSpeed: CONFIG.wingBeatSpeed, // wing-beat speed (rad/s)
    flap: 0,          // 0..1 squash after a flap
  };
}

function startGame() {
  game.state = 'playing';
  spawnColumn(W + 120);
  flap();
}

function flap() {
  const p = game.player;
  p.vy = CONFIG.flapVelocity;
  p.flap = 1;
  p.wingSpeed = CONFIG.flapWingSpeed;
  p.wing = Math.PI; // jump to the downstroke so every flap is visible
  sound.flap();
}

/* =====================================================================
   Obstacles
   ===================================================================== */
function currentGap() {
  return Math.max(CONFIG.minGap, CONFIG.startGap - game.score * CONFIG.gapPerPoint);
}

function spawnColumn(x) {
  const gap = currentGap();
  // Keep the opening away from the ceiling/ground and not too far from
  // the previous one, so every layout is reachable.
  const minC = CONFIG.gapEdgeMargin + gap / 2;
  const maxC = GROUND_Y - CONFIG.gapEdgeMargin - gap / 2;
  const lo = Math.max(minC, game.lastGapCenter - CONFIG.maxGapShift);
  const hi = Math.min(maxC, game.lastGapCenter + CONFIG.maxGapShift);
  const center = lo + Math.random() * (hi - lo);
  game.lastGapCenter = center;
  const gapTop = center - gap / 2;
  const gapBottom = center + gap / 2;
  const P = CONFIG.pixelSize;
  const seed = () => Math.floor(Math.random() * 1e9);
  game.columns.push({
    x,
    gapTop,
    gapBottom,
    passed: false,
    // Each peak is unique; rows reach past the ceiling / under the ground.
    top: makePeak(seed(), Math.ceil(gapTop / P) + 2),
    bottom: makePeak(seed(), Math.ceil((GROUND_Y - gapBottom) / P) + 2),
  });
}

// Hitbox outline of one peak, matching the slopes in makePeak().
// dir = 1 for the bottom peak (grows down from tipY), -1 for the top one.
function peakPolygon(x, tipY, peak, dir) {
  const P = CONFIG.pixelSize;
  const far = (peak.rows + 20) * P;
  const pt = (ax, ay) => [x + ax * P, tipY + dir * ay * P];
  return [
    pt(peak.apex - 1, 0), pt(peak.apex + 1, 0),
    pt(peak.WP, peak.tpr), [x + peak.WP * P, tipY + dir * far],
    [x, tipY + dir * far], pt(0, peak.tpl),
  ];
}

/* =====================================================================
   Collision helpers
   ===================================================================== */
function distSqToSegment(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  const len = dx * dx + dy * dy;
  let t = len ? ((px - ax) * dx + (py - ay) * dy) / len : 0;
  t = Math.max(0, Math.min(1, t));
  const cx = ax + t * dx - px, cy = ay + t * dy - py;
  return cx * cx + cy * cy;
}

// True if a circle overlaps a (possibly concave) polygon.
function circleHitsPolygon(cx, cy, r, pts) {
  let inside = false;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const [xi, yi] = pts[i], [xj, yj] = pts[j];
    if ((yi > cy) !== (yj > cy) && cx < ((xj - xi) * (cy - yi)) / (yj - yi) + xi) inside = !inside;
    if (distSqToSegment(cx, cy, xi, yi, xj, yj) <= r * r) return true;
  }
  return inside;
}

function hitsColumn(col, cx, cy, r) {
  const w = CONFIG.columnWidth;
  if (cx + r < col.x || cx - r > col.x + w) return false; // quick reject
  return (
    circleHitsPolygon(cx, cy, r, peakPolygon(col.x, col.gapTop, col.top, -1)) ||
    circleHitsPolygon(cx, cy, r, peakPolygon(col.x, col.gapBottom, col.bottom, 1))
  );
}

/* =====================================================================
   Update (runs at a fixed 120 steps per second)
   ===================================================================== */
function crash() {
  game.state = 'dying';
  game.shake = 0.35;
  game.flash = 1;
  game.player.vy = Math.max(game.player.vy, 60);
  sound.hit();
}

function endRun() {
  game.state = 'over';
  game.overTimer = 0;
  if (game.score > game.best) {
    game.best = game.score;
    game.newBest = true;
    saveValue(STORAGE.best, game.best);
  }
}

// Gravity, capped fall speed, and tilt that follows vertical velocity.
function applyPhysics(dt, tiltDownBias) {
  const p = game.player;
  p.vy = Math.min(p.vy + CONFIG.gravity * dt, CONFIG.maxFallSpeed);
  p.y += p.vy * dt;
  const target = Math.min(
    CONFIG.maxTiltDown,
    Math.max(CONFIG.maxTiltUp, (p.vy / CONFIG.maxFallSpeed) * CONFIG.maxTiltDown + tiltDownBias)
  );
  p.angle += (target - p.angle) * Math.min(1, dt * CONFIG.tiltResponse);
}

function update(dt) {
  const p = game.player;
  const R = CONFIG.playerRadius;
  game.time += dt;
  game.shake = Math.max(0, game.shake - dt);
  game.flash = Math.max(0, game.flash - dt * 3);
  p.flap = Math.max(0, p.flap - dt * 5);
  p.wing += p.wingSpeed * dt;

  switch (game.state) {
    case 'ready': {
      // Hover in place while the world drifts by.
      game.scroll += CONFIG.startSpeed * dt;
      p.y = CONFIG.readyY + Math.sin(game.time * 3) * 6;
      p.angle = 0;
      p.wingSpeed += (CONFIG.wingBeatSpeed - p.wingSpeed) * Math.min(1, dt * 3);
      break;
    }

    case 'playing': {
      // Difficulty ramps gently with score, up to the configured limits.
      game.speed = Math.min(CONFIG.maxSpeed, CONFIG.startSpeed + game.score * CONFIG.speedPerPoint);
      const dx = game.speed * dt;
      game.scroll += dx;

      for (const col of game.columns) col.x -= dx;
      game.columns = game.columns.filter((col) => col.x > -CONFIG.columnWidth - 10);
      const last = game.columns[game.columns.length - 1];
      if (!last || last.x < W - CONFIG.columnSpacing) {
        spawnColumn((last ? last.x : W) + CONFIG.columnSpacing);
      }

      p.wingSpeed += (CONFIG.wingBeatSpeed - p.wingSpeed) * Math.min(1, dt * 3);
      applyPhysics(dt, 0);

      // Score once Clutch's centre passes a column's trailing edge.
      for (const col of game.columns) {
        if (!col.passed && col.x + CONFIG.columnWidth < CONFIG.playerX) {
          col.passed = true;
          game.score++;
          sound.score();
        }
      }

      // Collisions: ground, ceiling, peaks.
      const hr = R - CONFIG.hitboxForgiveness;
      if (p.y + R >= GROUND_Y) {
        p.y = GROUND_Y - R;
        crash();
        endRun();
      } else if (p.y - hr <= 0) {
        p.y = hr;
        p.vy = 0;
        crash();
      } else if (game.columns.some((col) => hitsColumn(col, CONFIG.playerX, p.y, hr))) {
        crash();
      }
      break;
    }

    case 'dying': {
      // World freezes; Clutch drops to the ground nose-first.
      p.wingSpeed += (0 - p.wingSpeed) * Math.min(1, dt * 2);
      applyPhysics(dt, 0.6);
      if (p.y + R >= GROUND_Y) {
        p.y = GROUND_Y - R;
        endRun();
      }
      break;
    }

    case 'over': {
      game.overTimer += dt;
      p.wingSpeed += (0 - p.wingSpeed) * Math.min(1, dt * 2);
      break;
    }
  }
}

/* =====================================================================
   Render
   ===================================================================== */
function drawReadyScreen(c) {
  drawText(c, 'CLUTCH', W / 2, 150, 62);
  drawText(c, 'Fly the Mountain Hawk between the peaks', W / 2, 202, 18);

  drawPanel(c, 90, 400, W - 180, 130);
  const pulse = 0.6 + 0.4 * Math.sin(game.time * 4);
  c.globalAlpha = pulse;
  drawSmallText(c, 'Tap, click or Space to flap', W / 2, 432, 18, PALETTE.accentLight);
  c.globalAlpha = 1;
  drawSmallText(c, 'M to mute  ·  T for day / night', W / 2, 462, 14);
  drawSmallText(c, `Best: ${game.best}`, W / 2, 498, 20, PALETTE.gold);
}

function drawGameOverScreen(c) {
  // Slide the panel in from above.
  const t = Math.min(1, game.overTimer / 0.35);
  const ease = 1 - Math.pow(1 - t, 3);
  const y0 = -280 + ease * 450;

  c.fillStyle = PALETTE.dim;
  c.globalAlpha = ease;
  c.fillRect(0, 0, W, H);
  c.globalAlpha = 1;
  drawPanel(c, 70, y0, W - 140, 270);
  drawText(c, 'GAME OVER', W / 2, y0 + 48, 40);

  drawSmallText(c, 'SCORE', W / 2 - 80, y0 + 105, 15, PALETTE.accentLight);
  drawSmallText(c, 'BEST', W / 2 + 80, y0 + 105, 15, PALETTE.accentLight);
  drawText(c, game.score, W / 2 - 80, y0 + 145, 44);
  drawText(c, game.best, W / 2 + 80, y0 + 145, 44, PALETTE.gold);

  if (game.newBest) {
    const s = 1 + 0.06 * Math.sin(game.time * 8);
    c.save();
    c.translate(W / 2, y0 + 192);
    c.scale(s, s);
    drawText(c, 'NEW BEST!', 0, 0, 22, PALETTE.accentMid);
    c.restore();
  }

  if (game.overTimer >= CONFIG.restartDelay) {
    c.globalAlpha = 0.6 + 0.4 * Math.sin(game.time * 4);
    drawSmallText(c, 'Tap or Space to retry', W / 2, y0 + 240, 17, PALETTE.accentLight);
    c.globalAlpha = 1;
  }
}

function render(c) {
  const p = game.player;

  c.save();
  if (game.shake > 0) {
    const m = (game.shake / 0.35) * 6;
    c.translate((Math.random() - 0.5) * m, (Math.random() - 0.5) * m);
  }

  drawBackground(c, game.time, game.scroll);
  for (const col of game.columns) {
    drawColumnPair(c, col);
  }
  drawGround(c, game.scroll);

  const dead = game.state === 'dying' || game.state === 'over';
  const eye = dead ? 'ko' : game.time % 3.2 < 0.12 ? 'blink' : 'open';
  drawPlayer(c, CONFIG.playerX, p.y, p.angle, p.wing, p.flap, eye);
  c.restore();

  if (game.flash > 0) {
    c.fillStyle = `rgba(255, 245, 235, ${game.flash * 0.6})`;
    c.fillRect(0, 0, W, H);
  }

  if (game.state === 'ready') drawReadyScreen(c);
  if (game.state === 'playing' || game.state === 'dying') drawScore(c, game.score, W / 2, 70, 56);
  if (game.state === 'over') drawGameOverScreen(c);

  drawSoundIcon(c, MUTE_BUTTON.x, MUTE_BUTTON.y, sound.muted);
  drawThemeIcon(c, THEME_BUTTON.x, THEME_BUTTON.y, themeName);
}

/* =====================================================================
   Input — mouse, touch and pen via pointer events, plus keyboard.
   ===================================================================== */
const MUTE_BUTTON = { x: W - 36, y: 36, r: 24 };
const THEME_BUTTON = { x: W - 36, y: 86, r: 24 };

function handlePress() {
  sound.init(); // first gesture unlocks audio
  if (game.state === 'ready') startGame();
  else if (game.state === 'playing') flap();
  else if (game.state === 'over' && game.overTimer >= CONFIG.restartDelay) resetGame();
}

// Convert a screen position to logical 480x720 coordinates.
function toLogical(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: ((clientX - rect.left) / rect.width) * W,
    y: ((clientY - rect.top) / rect.height) * H,
  };
}

// Listen on the whole window so taps on the letterbox area also count.
window.addEventListener('pointerdown', (e) => {
  if (e.button > 0) return; // left click / touch only
  e.preventDefault();
  const pt = toLogical(e.clientX, e.clientY);
  if (Math.hypot(pt.x - MUTE_BUTTON.x, pt.y - MUTE_BUTTON.y) <= MUTE_BUTTON.r) {
    sound.init();
    sound.toggleMute();
    return;
  }
  if (Math.hypot(pt.x - THEME_BUTTON.x, pt.y - THEME_BUTTON.y) <= THEME_BUTTON.r) {
    toggleTheme();
    return;
  }
  handlePress();
}, { passive: false });

window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
    e.preventDefault(); // stop the page from scrolling
    if (!e.repeat) handlePress();
  } else if (e.code === 'KeyT' && !e.repeat) {
    toggleTheme();
  } else if (e.code === 'KeyM' && !e.repeat) {
    sound.init();
    sound.toggleMute();
  }
});

// Block the long-press context menu on mobile.
window.addEventListener('contextmenu', (e) => e.preventDefault());

/* =====================================================================
   Main loop — fixed timestep so the game plays identically on 60, 120
   or 144 Hz screens. Rendering happens once per display frame.
   ===================================================================== */
const STEP = 1 / 120;
let accumulator = 0;
let lastTime = performance.now();

function frame(now) {
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (dt > 0.25) dt = 0.25; // avoid a huge catch-up after tab switches
  accumulator += dt;
  while (accumulator >= STEP) {
    update(STEP);
    accumulator -= STEP;
  }
  render(ctx);
  requestAnimationFrame(frame);
}

resetGame();
requestAnimationFrame(frame);
</script>
</body>
